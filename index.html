<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星耀峡谷 · 网页 MOBA</title>
<style>
:root{
  --abyss:#0b0f17; --panel:rgba(9,14,24,.78); --panel-solid:#101724;
  --gold:#c9a24b; --gold-hi:#f0d489; --gold-dim:rgba(201,162,75,.35);
  --blue:#3f9bff; --blue-deep:#1b5edb; --red:#ff5252; --red-deep:#c22b3f;
  --ink:#e9e2cf; --ink-dim:#9aa4b5;
  --mana:#2f7fd6; --hp:#39d353; --cd:rgba(8,10,16,.82);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--abyss)}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;color:var(--ink);touch-action:none}
canvas{display:block}
.hidden{display:none!important}
#app{position:fixed;inset:0}
#game{position:absolute;inset:0;width:100%;height:100%}

/* ---------- 竖屏提示 ---------- */
#rotate{position:fixed;inset:0;z-index:300;background:var(--abyss);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;text-align:center}
#rotate .ph{width:64px;height:100px;border:3px solid var(--gold);border-radius:10px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
#rotate p{color:var(--ink-dim);font-size:15px;letter-spacing:2px}
@media (orientation:landscape){#rotate{display:none}}

/* ---------- 选人界面 ---------- */
#select{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(120% 90% at 20% 110%,#12203a 0%,transparent 55%),
             radial-gradient(120% 90% at 80% -10%,#2a1218 0%,transparent 55%),
             linear-gradient(160deg,#0d1320 0%,#0b0f17 100%)}
#select .title-wrap{margin-top:4.5vh;text-align:center;position:relative;padding:0 30px}
#select h1{font-size:clamp(30px,5.4vw,52px);font-weight:900;letter-spacing:.22em;text-indent:.22em;
  background:linear-gradient(180deg,#fbe9b8 8%,#e2b95f 45%,#8a6a25 92%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(226,185,95,.25))}
#select .sub{margin-top:10px;font-size:13px;color:var(--ink-dim);letter-spacing:.5em;text-indent:.5em}
#select .sub b{color:var(--gold);font-weight:600}
.title-rule{width:min(560px,72vw);height:1px;margin:16px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold-dim) 25%,var(--gold) 50%,var(--gold-dim) 75%,transparent)}
#cards{flex:1;display:flex;gap:clamp(10px,2.2vw,26px);align-items:center;justify-content:center;
  padding:12px 16px;width:100%;max-width:1060px}
.card{position:relative;width:clamp(150px,19vw,208px);border-radius:8px;cursor:pointer;
  background:linear-gradient(180deg,#141c2c 0%,#0e1420 100%);
  border:1px solid #26314a;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  padding:10px 10px 12px;text-align:center}
.card:hover{transform:translateY(-6px);border-color:var(--gold-dim)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 12px 34px rgba(201,162,75,.18);transform:translateY(-8px)}
.card canvas{width:100%;border-radius:5px;background:radial-gradient(90% 70% at 50% 30%,#1b2740 0%,#0c111d 100%)}
.card .cname{margin-top:10px;font-size:17px;font-weight:700;letter-spacing:.08em}
.card .crole{margin-top:3px;font-size:12px;color:var(--ink-dim)}
.card .tags{display:flex;justify-content:center;gap:6px;margin-top:9px}
.card .tag{font-size:11px;padding:2px 9px;border-radius:3px;border:1px solid #2c3950;color:var(--ink-dim)}
.card .tag.ad{color:#e8b06a;border-color:#5c462a}
.card .tag.ap{color:#7db4ff;border-color:#2c4a75}
.card .tag.tank{color:#8fd6a0;border-color:#2d5738}
.card .ctags{margin-top:9px;font-size:11px;color:var(--ink-dim);line-height:1.7}
.card .ctags b{color:var(--gold-hi);font-weight:600}
button{font-family:inherit}
#select .foot{margin:0 0 4.5vh;display:flex;flex-direction:column;align-items:center;gap:12px}
#btnStart{font-family:inherit;font-size:19px;font-weight:800;letter-spacing:.35em;text-indent:.35em;color:#241a06;
  background:linear-gradient(180deg,#f6dd9b,#d5a94b 60%,#b98f33);border:1px solid #8a6a25;border-radius:5px;
  padding:13px 64px;cursor:pointer;transition:filter .15s,opacity .15s;opacity:.35;pointer-events:none}
#btnStart.ready{opacity:1;pointer-events:auto}
#btnStart.ready:hover{filter:brightness(1.1)}
#select .hint{font-size:12px;color:var(--ink-dim);letter-spacing:.15em}

/* ---------- HUD 通用 ---------- */
#hud{position:absolute;inset:0;z-index:20;pointer-events:none;font-size:13px}
#hud .tap{pointer-events:auto}

/* 计分板 */
#scorebar{position:absolute;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;padding:5px 18px;border-radius:6px;
  background:var(--panel);border:1px solid #2a3550;border-top:1px solid var(--gold-dim)}
#scorebar .kills{font-size:19px;font-weight:800;min-width:26px;text-align:center}
#scorebar .kb{color:var(--blue)} #scorebar .kr{color:var(--red)}
#scorebar .clock{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.06em}
#scorebar .mute{cursor:pointer;color:var(--ink-dim);font-size:14px;line-height:1;padding:2px}
#scorebar .mute:hover{color:var(--gold-hi)}

/* 个人状态 */
#mystats{position:absolute;top:calc(6px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));
  background:var(--panel);border:1px solid #2a3550;border-radius:6px;padding:6px 12px;display:flex;gap:14px;align-items:center}
#mystats .lv{width:26px;height:26px;border-radius:4px;background:linear-gradient(180deg,#1d2c4a,#152036);
  border:1px solid var(--gold-dim);color:var(--gold-hi);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
#mystats .gold{color:var(--gold-hi);font-weight:700;font-variant-numeric:tabular-nums}
#mystats .kda{color:var(--ink-dim);font-variant-numeric:tabular-nums}
#mystats .kda b{color:var(--ink)}

/* 小地图 */
#miniWrap{position:absolute;top:calc(52px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));
  border:1px solid #2a3550;border-radius:6px;overflow:hidden;background:#0a0e16}
#minimap{width:138px;height:138px}

/* 击杀播报 */
#killfeed{position:absolute;top:calc(6px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
  display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.kf{background:var(--panel);border:1px solid #2a3550;border-radius:4px;padding:4px 12px;font-size:12px;
  color:var(--ink-dim);animation:kfin .25s ease;white-space:nowrap}
.kf b{font-weight:700}.kf .b{color:var(--blue)}.kf .r{color:var(--red)}.kf .g{color:var(--gold-hi)}
.kf.out{opacity:0;transition:opacity .8s}
@keyframes kfin{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}

/* 中央公告 */
#announce{position:absolute;top:17%;left:50%;transform:translateX(-50%);text-align:center;width:100%}
.ann{font-size:clamp(20px,3.4vw,32px);font-weight:900;letter-spacing:.18em;text-shadow:0 2px 14px rgba(0,0,0,.7);
  animation:annin 2.6s ease forwards}
.ann.gold{color:var(--gold-hi)} .ann.blue{color:#8fc3ff} .ann.red{color:#ff8d8d}
@keyframes annin{0%{opacity:0;transform:scale(1.25)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0}}

/* 摇杆 */
#joyBase{position:absolute;width:118px;height:118px;border-radius:50%;border:2px solid rgba(233,226,207,.22);
  background:radial-gradient(circle,rgba(20,28,44,.35) 0%,rgba(10,14,24,.55) 75%);display:none;z-index:25}
#joyKnob{position:absolute;left:33px;top:33px;width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#3a4a6b,#182338 70%);border:2px solid rgba(233,226,207,.4);
  box-shadow:0 4px 14px rgba(0,0,0,.5)}
#joyHint{position:absolute;bottom:18%;left:9%;color:rgba(233,226,207,.35);font-size:12px;letter-spacing:.2em}

/* 技能区 */
#skillzone{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));
  width:270px;height:230px}
.skill{position:absolute;border-radius:50%;border:2px solid #3a4763;background:radial-gradient(circle at 34% 28%,#232f4c,#111827 78%);
  color:var(--ink);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.55);transition:transform .08s}
.skill:active{transform:scale(.92)}
.skill .key{font-size:23px;font-weight:900;color:var(--gold-hi);line-height:1}
.skill .nm{font-size:10px;color:var(--ink-dim);margin-top:3px;letter-spacing:.05em}
.skill .cdmask{position:absolute;inset:0;border-radius:50%;display:none}
.skill .cdsec{position:absolute;font-size:19px;font-weight:800;color:#fff;text-shadow:0 1px 4px #000;display:none}
.skill .cost{position:absolute;bottom:3px;right:8px;font-size:10px;color:#7db4ff;font-weight:700}
.skill.dim{filter:grayscale(.75) brightness(.6)}
.skill.lockR{filter:grayscale(1) brightness(.45)}
#skA{width:82px;height:82px;right:8px;bottom:6px;border-color:#5a4a28}
#skQ{width:64px;height:64px;right:106px;bottom:0}
#skW{width:64px;height:64px;right:134px;bottom:82px}
#skE{width:64px;height:64px;right:80px;bottom:130px}
#skR{width:72px;height:72px;right:6px;bottom:112px;border-color:var(--gold)}
#btnRecall{position:absolute;left:6px;bottom:4px;width:56px;height:56px;border-radius:50%;border:2px solid #3a4763;
  background:radial-gradient(circle at 34% 28%,#1e2c44,#0e1522 78%);color:var(--ink-dim);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;letter-spacing:.1em}
#btnRecall .key{font-size:17px;color:var(--ink);font-weight:700}
#btnRecall.rec{border-color:var(--gold);color:var(--gold-hi)}
#btnShop{position:absolute;left:6px;bottom:120px;width:56px;height:56px;border-radius:8px;border:2px solid #3a4763;
  background:radial-gradient(circle at 34% 28%,#1e2c44,#0e1522 78%);color:var(--ink-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.1em}
#btnShop .badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:8px;background:var(--gold);
  color:#241a06;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}

/* 装备栏 */
#invbar{position:absolute;right:calc(300px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;gap:4px}
.islot{width:34px;height:34px;border-radius:5px;border:1px solid #2a3550;background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-dim)}

/* 商店面板 */
#shop{position:absolute;left:calc(10px + env(safe-area-inset-left));top:50%;transform:translateY(-50%);
  width:308px;max-height:82vh;overflow-y:auto;background:var(--panel-solid);border:1px solid #2a3550;
  border-radius:8px;padding:12px;z-index:30}
#shop h3{font-size:14px;letter-spacing:.2em;color:var(--gold-hi);display:flex;justify-content:space-between;align-items:center}
#shop h3 span{cursor:pointer;color:var(--ink-dim);font-size:16px;padding:0 4px}
#shopGold{font-size:13px;color:var(--gold-hi);margin:8px 0;font-weight:700}
.sitem{display:flex;align-items:center;gap:9px;padding:7px 8px;border:1px solid #26314a;border-radius:6px;
  margin-bottom:6px;background:#131b2b}
.sitem .ico{width:34px;height:34px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;border:1px solid #3a4763}
.sitem .info{flex:1;min-width:0}
.sitem .nm{font-size:13px;font-weight:700}
.sitem .st{font-size:11px;color:var(--ink-dim);margin-top:2px}
.sitem button{font-family:inherit;flex:none;font-size:11px;font-weight:700;color:#241a06;border:none;border-radius:4px;
  padding:6px 10px;cursor:pointer;background:linear-gradient(180deg,#e8c877,#c39b3e)}
.sitem button:disabled{background:#2a3550;color:#68758e;cursor:default}
.sitem.owned{opacity:.45}

/* 回城进度 & 复活 */
#centerNote{position:absolute;left:50%;top:58%;transform:translateX(-50%);text-align:center}
#centerNote .t1{font-size:17px;font-weight:800;letter-spacing:.25em;color:var(--gold-hi);text-shadow:0 2px 8px #000}
#centerNote .t2{font-size:12px;color:var(--ink-dim);margin-top:6px;letter-spacing:.1em}

/* 结算 */
#endscr{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(6,9,15,.88);backdrop-filter:blur(3px)}
#endTitle{font-size:clamp(44px,8vw,84px);font-weight:900;letter-spacing:.3em;text-indent:.3em;
  filter:drop-shadow(0 4px 22px rgba(0,0,0,.8))}
#endTitle.win{background:linear-gradient(180deg,#fbe9b8,#d5a94b 55%,#8a6a25);-webkit-background-clip:text;background-clip:text;color:transparent}
#endTitle.lose{background:linear-gradient(180deg,#ffb1b1,#c22b3f 55%,#6b1523);-webkit-background-clip:text;background-clip:text;color:transparent}
#endSub{margin-top:6px;color:var(--ink-dim);font-size:14px;letter-spacing:.2em}
#endStats{margin:30px 0 8px;border:1px solid #2a3550;border-radius:8px;overflow:hidden;min-width:min(520px,88vw)}
#endStats table{width:100%;border-collapse:collapse;font-size:13px}
#endStats th{background:#141d30;color:var(--ink-dim);font-weight:600;padding:8px 14px;text-align:center;font-size:12px;letter-spacing:.1em}
#endStats td{padding:8px 14px;text-align:center;border-top:1px solid #1d2740;font-variant-numeric:tabular-nums}
#endStats .me{color:var(--gold-hi);font-weight:700}
#endStats .bb{color:var(--blue)} #endStats .rr{color:var(--red)}
#btnAgain{margin-top:26px;font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.3em;text-indent:.3em;color:#241a06;
  background:linear-gradient(180deg,#f6dd9b,#d5a94b 60%,#b98f33);border:1px solid #8a6a25;border-radius:5px;
  padding:12px 52px;cursor:pointer}
#btnAgain:hover{filter:brightness(1.1)}

/* 错误条 */
#errbar{position:fixed;left:0;right:0;bottom:0;z-index:999;background:#5c1520;color:#ffd9d9;
  font-size:11px;padding:3px 10px;display:none;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="scorebar" class="tap">
      <span class="kills kb" id="scoreB">0</span>
      <span class="clock" id="clock">00:00</span>
      <span class="kills kr" id="scoreR">0</span>
      <span class="mute" id="btnMute" title="音效开关">♪</span>
    </div>
    <div id="mystats">
      <span class="lv" id="myLv">1</span>
      <span class="gold" id="myGold">0</span>
      <span class="kda" id="myKda"><b>0</b>/0/0</span>
    </div>
    <div id="miniWrap"><canvas id="minimap" width="138" height="138"></canvas></div>
    <div id="killfeed"></div>
    <div id="announce"></div>

    <div id="skillzone" class="tap">
      <div class="skill" id="skR"><span class="key">R</span><span class="nm">大招</span><div class="cdmask"></div><span class="cdsec"></span><span class="cost"></span></div>
      <div class="skill" id="skQ"><span class="key">Q</span><span class="nm">技能</span><div class="cdmask"></div><span class="cdsec"></span><span class="cost"></span></div>
      <div class="skill" id="skW"><span class="key">W</span><span class="nm">技能</span><div class="cdmask"></div><span class="cdsec"></span><span class="cost"></span></div>
      <div class="skill" id="skE"><span class="key">E</span><span class="nm">技能</span><div class="cdmask"></div><span class="cdsec"></span><span class="cost"></span></div>
      <div class="skill" id="skA"><span class="key">⚔</span><span class="nm">普攻</span></div>
      <button id="btnRecall"><span class="key">⌂</span>回城</button>
      <button id="btnShop">商店<span class="badge" id="shopBadge">1</span></button>
    </div>
    <div id="invbar"></div>

    <div id="shop" class="hidden tap">
      <h3>装备商店 <span id="shopClose">✕</span></h3>
      <div id="shopGold">金币 0</div>
      <div id="shopList"></div>
    </div>
    <div id="centerNote" class="hidden"></div>
  </div>

  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="joyHint">左侧区域拖动移动</div>

  <div id="select">
    <div class="title-wrap">
      <h1>星耀峡谷</h1>
      <div class="sub">网页 MOBA · 致敬 <b>英雄联盟手游</b> 的同人 Demo</div>
      <div class="title-rule"></div>
    </div>
    <div id="cards"></div>
    <div class="foot">
      <button id="btnStart">开 始 对 局</button>
      <div class="hint">左侧摇杆移动 · 右侧按钮释放技能 · 击破敌方水晶获胜</div>
    </div>
  </div>

  <div id="endscr" class="hidden">
    <div id="endTitle">胜利</div>
    <div id="endSub"></div>
    <div id="endStats"></div>
    <button id="btnAgain">再来一局</button>
  </div>

  <div id="rotate"><div class="ph"></div><p>请横屏游玩 · 建议手机或平板浏览器打开</p></div>
  <div id="errbar"></div>
</div>
<script>
"use strict";
/* ================= PART 2 · 工具 / 配置 / 音效 ================= */
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[(Math.random()*arr.length)|0];
const fmtG=n=>n>=10000?(n/1000).toFixed(1)+'w':''+Math.floor(n);
const fmtT=s=>{s=Math.floor(s);return String((s/60)|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

window.addEventListener('error',e=>{const b=$('errbar');if(b){b.style.display='block';b.textContent='脚本错误: '+e.message+' @'+e.lineno;}});

const WORLD=2400;
const TEAM_COL=['#3f9bff','#ff5252'];
const TEAM_NAME=['蓝方','红方'];
/* 兵线路径(蓝方→红方向);红方小兵反向遍历 */
const LANES={
  top:[{x:300,y:1980},{x:290,y:700},{x:380,y:380},{x:700,y:290},{x:1980,y:300}],
  mid:[{x:420,y:1980},{x:1980,y:420}],
  bot:[{x:420,y:2100},{x:1780,y:2110},{x:2110,y:1780},{x:2110,y:700},{x:2000,y:350}]
};
const NEXUS_POS=[{x:230,y:2170},{x:2170,y:230}];
const FOUNTAIN=[{x:170,y:2230},{x:2230,y:170}];
/* 防御塔定义 tier:0外塔 1内塔 2门牙塔 */
const TURRET_DEFS=[
  {t:0,lane:'top',tier:0,x:290, y:1150},{t:0,lane:'top',tier:1,x:290, y:1650},
  {t:0,lane:'mid',tier:0,x:1030,y:1370},{t:0,lane:'mid',tier:1,x:700, y:1700},
  {t:0,lane:'bot',tier:0,x:1150,y:2100},{t:0,lane:'bot',tier:1,x:1650,y:2105},
  {t:0,lane:'nexus',tier:2,x:430,y:1970},
  {t:1,lane:'top',tier:0,x:1150,y:290 },{t:1,lane:'top',tier:1,x:1650,y:290 },
  {t:1,lane:'mid',tier:0,x:1370,y:1030},{t:1,lane:'mid',tier:1,x:1700,y:700 },
  {t:1,lane:'bot',tier:0,x:2100,y:1150},{t:1,lane:'bot',tier:1,x:2105,y:1650},
  {t:1,lane:'nexus',tier:2,x:1970,y:430},
];
/* 野怪营地 */
const CAMPS=[
  {id:'golemA',kind:'golem', x:820, y:560, r:30},
  {id:'golemB',kind:'golem', x:1580,y:1840,r:30},
  {id:'herald',kind:'herald',x:710, y:710, r:40},

/* ================= 音效(WebAudio 合成) ================= */
const Snd=(()=>{
  let ctx=null,on=true;
  function ac(){
    if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
    if(ctx&&ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function tone(f,dur,type,vol,slide){
    const c=ac(); if(!c||!on)return;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),c.currentTime+dur);
    g.gain.setValueAtTime(vol||.12,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur+.02);
  }
  return {
    unlock:ac,
    hit:()=>tone(190,.06,'square',.045,-70),
    shoot:()=>tone(520,.05,'triangle',.035,-220),
    skill:i=>tone(320+i*95,.16,'sawtooth',.06,130),
    kill:()=>{tone(392,.22,'triangle',.15);setTimeout(()=>tone(523,.32,'triangle',.15),90);},
    death:()=>tone(210,.45,'sawtooth',.11,-130),
    tower:()=>{tone(110,.5,'square',.13,-40);setTimeout(()=>tone(74,.6,'square',.11,-20),120);},
    lvup:()=>{tone(523,.1,'sine',.09);setTimeout(()=>tone(659,.1,'sine',.09),80);setTimeout(()=>tone(784,.2,'sine',.11),160);},
    gold:()=>tone(920,.05,'sine',.025),
    dragon:()=>tone(64,.9,'sawtooth',.15,-18),
    recall:()=>tone(300,.3,'sine',.06,180),
    win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.13),i*160)),
    lose:()=>[440,349,262,196].forEach((f,i)=>setTimeout(()=>tone(f,.42,'triangle',.11),i*190)),
    toggle(){on=!on;return on;},
  };
})();

/* ---------- 基础单位 ---------- */
class Unit{
  constructor(o){
    this.id=uid++;this.type='unit';this.team=o.team;
    this.x=o.x;this.y=o.y;this.r=o.r||20;
    this.maxhp=o.maxhp;this.hp=o.maxhp;
    this.ad=o.ad||0;this.def=o.def||0;this.spd=o.spd||0;
    this.range=o.range||60;this.atkCd=o.atkCd||1;this.atkT=rand(0,.3);
    this.dead=false;this.target=null;this.face=0;
    this.shield=0;this.slowPct=0;this.slowT=0;this.lastCombat=-99;this.dmgTextT=0;
  }
  get alive(){return !this.dead;}
  curSpd(){return this.spd*(this.slowT>G.t?1-this.slowPct:1);}
  defVal(){return this.def||0;}
  moveTo(tx,ty,dt){
    const dx=tx-this.x,dy=ty-this.y,d=Math.hypot(dx,dy);
    if(d<3)return true;
    const st=Math.min(d,this.curSpd()*dt);
    this.x+=dx/d*st;this.y+=dy/d*st;this.face=Math.atan2(dy,dx);
    return d-st<6;
  }
  applySlow(pct,dur){if(pct>=this.slowPct||this.slowT<G.t){this.slowPct=pct;this.slowT=G.t+dur;}}
  fireAt(tgt){ /* 普攻出手 */
    this.atkT=this.atkInterval?this.atkInterval():this.atkCd;
    this.face=Math.atan2(tgt.y-this.y,tgt.x-this.x);
    const melee=this.range<=120;
    if(melee){
      dealDamage(this,tgt,this.attDamage?this.attDamage():this.ad,'phys');
      addBurst(tgt.x,tgt.y,this.team===0?'#7fb6ff':'#ff9b9b',3,90,2);
      if(this.isPlayer||tgt.isPlayer)Snd.hit();
    }else{
      G.projs.push({x:this.x,y:this.y,homing:tgt,spd:640,team:this.team,src:this,
        dmg:this.attDamage?this.attDamage():this.ad,kind:'phys',radius:10,
        col:this.type==='turret'?(this.team===0?'#9ec8ff':'#ffb0b0'):TEAM_COL[this.team],trail:[]});
      if(this.isPlayer||tgt.isPlayer)Snd.shoot();
    }
  }
  update(dt){}
}
Unit.prototype.attDamage=null;

/* ---------- 英雄 ---------- */
class Champion extends Unit{
  constructor(cid,team,name,isPlayer,lane){
    const d=CHAMPS[cid];
    super({team,x:FOUNTAIN[team].x+rand(-50,50),y:FOUNTAIN[team].y+rand(-50,50),r:26,
      maxhp:d.hp,ad:d.ad,def:d.def,spd:d.spd,range:d.range,atkCd:d.atkCd});
    this.type='champ';this.cid=cid;this.cdef=d;this.name=name;
    this.isPlayer=!!isPlayer;this.lane=lane;
    this.level=1;this.xp=0;this.gold=300;this.bountyBase=250;
    this.maxmana=d.mana;this.mana=d.mana;
    this.items=[];this.cds={Q:0,W:0,E:0,R:0};
    this.kills=0;this.deaths=0;this.assists=0;this.cs=0;this.dmg=0;this.streak=0;
    this.respawnT=0;this.recallT=-1;this.dash=null;this.aspBuff=0;
    this.sticky=null;this.stickyT=0;
    this.ai=isPlayer?null:{mode:'push',retreatT:0,skillCdT:0};
  }
  itemStat(k){let s=0;for(const it of this.items){if(it.st[k])s+=it.st[k];}return s;}
  AD(){return (this.cdef.ad+this.cdef.adG*(this.level-1)+this.itemStat('ad'))*(1+.06*G.buffs[this.team].drag);}
  AP(){return (this.itemStat('ap'))*(1+.06*G.buffs[this.team].drag);}
  DEF(){return this.cdef.def+this.cdef.defG*(this.level-1)+this.itemStat('def');}
  defVal(){return this.DEF();}
  curSpd(){return (this.cdef.spd+this.itemStat('spd'))*(this.slowT>G.t?1-this.slowPct:1);}
  atkInterval(){
    const as=this.itemStat('as')+(this.aspBuff>G.t?.5:0);
    return this.cdef.atkCd/(1+as);
  }
  attDamage(){
    let v=this.AD();
    if(G.buffs[this.team].heraldUntil>G.t&&this.target&&this.target.type==='turret')v*=1.3;
    return v;
  }
  refresh(){
    this.maxhp=this.cdef.hp+this.cdef.hpG*(this.level-1)+this.itemStat('hp');
    this.maxmana=this.cdef.mana+this.cdef.manaG*(this.level-1);
  }
  giveGold(a){this.gold+=a;if(this.isPlayer)Snd.gold();}
  giveXp(a){
    if(this.level>=15)return;
    this.xp+=a;const need=lv=>160+105*(lv-1);
    while(this.level<15&&this.xp>=need(this.level)){
      this.xp-=need(this.level);this.level++;this.refresh();
      this.hp+=this.cdef.hpG;this.mana+=this.cdef.manaG;
      addBurst(this.x,this.y,'#f0d489',18,170,3);
      if(this.isPlayer){Snd.lvup();announce('等级提升  Lv.'+this.level,'gold');}
    }
  }
  die(){
    this.dead=true;this.deaths++;this.streak=0;this.hp=0;
    this.respawnT=6+this.level*1.8;this.recallT=-1;this.dash=null;
    addBurst(this.x,this.y,this.team===0?'#3f9bff':'#ff5252',26,220,4);
  }
  revive(){
    this.dead=false;this.refresh();this.hp=this.maxhp;this.mana=this.maxmana;
    this.x=FOUNTAIN[this.team].x+rand(-40,40);this.y=FOUNTAIN[this.team].y+rand(-40,40);
    this.target=null;this.sticky=null;this.slowT=0;this.shield=0;
  }
  update(dt){
    if(this.dead){this.respawnT-=dt;if(this.respawnT<=0)this.revive();return;}
    for(const k in this.cds)this.cds[k]=Math.max(0,this.cds[k]-dt);
    this.gold+=1.7*dt;   /* 自然金币 */
    this.giveXp(3.2*dt); /* 自然经验(快节奏) */
    this.refresh();
    /* 泉水回复 / 常规回复 */
    const f=FOUNTAIN[this.team];
    if(dist(this,f)<300){this.hp=Math.min(this.maxhp,this.hp+this.maxhp*.09*dt);this.mana=Math.min(this.maxmana,this.mana+this.maxmana*.1*dt);}
    else{
      const ooc=G.t-this.lastCombat>5;
      this.hp=Math.min(this.maxhp,this.hp+this.maxhp*(ooc?.013:.003)*dt);
      this.mana=Math.min(this.maxmana,this.mana+this.maxmana*(ooc?.02:.011)*dt);
    }
    /* 冲刺位移 */
    if(this.dash){
      const d=this.dash;d.rem-=dt;
      const nx=this.x+Math.cos(d.a)*d.spd*dt,ny=this.y+Math.sin(d.a)*d.spd*dt;
      this.x=clamp(nx,30,WORLD-30);this.y=clamp(ny,30,WORLD-30);this.face=d.a;
      addBurst(this.x,this.y,this.cdef.col,1,40,2.4);
      if(d.rem<=0||d.hitCb&&d.hitCb())this.dash=null;
      return;
    }
    /* 回城引导 */
    if(this.recallT>=0){
      this.recallT+=dt;
      if(this.recallT>=3.4){
        this.x=f.x+rand(-30,30);this.y=f.y+rand(-30,30);this.recallT=-1;
        addBurst(this.x,this.y,'#f0d489',16,150,3);
      }
      return;
    }
    if(this.stickyT>0){this.stickyT-=dt;if(this.stickyT<=0)this.sticky=null;}
    if(this.shieldT&&G.t>this.shieldT){this.shield=0;this.shieldT=0;}
    this.atkT-=dt;
  }
}

/* ---------- 小兵 ---------- */
class Minion extends Unit{
  constructor(team,lane,wave,kind,holdDelay){
    const isM=kind==='melee',isS=kind==='siege';
    const pts=LANES[lane],p0=team===0?pts[0]:pts[pts.length-1],f=FOUNTAIN[team];
    let sx=p0.x+(f.x-p0.x)*.16+rand(-26,26),sy=p0.y+(f.y-p0.y)*.16+rand(-26,26);
    super({team,x:sx,y:sy,r:isS?15:isM?12:10,
      maxhp:(isM?370+23*wave:isS?960+45*wave:240+17*wave),
      ad:(isM?26+1.7*wave:isS?50+2.6*wave:33+2.3*wave),
      def:isM?12:isS?18:4,spd:170,range:isM?58:isS?150:205,atkCd:isM?1:1.4});
    this.type='minion';this.kind=kind;this.lane=lane;
    this.wp=team===0?0:pts.length-1;
    this.gold=isM?42:isS?62:32;this.xpv=isM?30:isS?46:24;
    this.holdT=holdDelay||0;
  }
  nextWp(){
    const pts=LANES[this.lane];
    if(this.team===0)return this.wp<pts.length-1?pts[this.wp+1]:{x:NEXUS_POS[1].x,y:NEXUS_POS[1].y};
    return this.wp>0?pts[this.wp-1]:{x:NEXUS_POS[0].x,y:NEXUS_POS[0].y};
  }
  acquire(){
    let best=null,bd=340*340;
    for(const u of G.units){
      if(!u.alive||!isEnemy(this,u))continue;
      if(u.team===2)continue; /* 小兵不打野怪 */
      const d=(u.x-this.x)**2+(u.y-this.y)**2;
      if(d<bd){bd=d;best=u;}
    }
    return best;
  }
  update(dt){
    if(this.holdT>0){this.holdT-=dt;return;}
    this.atkT-=dt;
    if(!this.target||this.target.dead||dist(this,this.target)>430)this.target=this.acquire();
    const t=this.target;
    if(t){
      const d=dist(this,t);
      if(d<=this.range+t.r*0.6){if(this.atkT<=0)this.fireAt(t);}
      else this.moveTo(t.x,t.y,dt);
      return;
    }
    /* 沿兵线推进 */
    const w=this.nextWp();
    if(this.moveTo(w.x,w.y,dt)){
      if(this.team===0&&this.wp<LANES[this.lane].length-1)this.wp++;
      else if(this.team===1&&this.wp>0)this.wp--;
    }
  }
}

/* ---------- 防御塔 / 水晶 ---------- */
class Turret extends Unit{
  constructor(def){
    super({team:def.t,x:def.x,y:def.y,r:26,
      maxhp:def.tier===2?3000:def.tier===1?2800:2400,
      ad:def.tier===2?225:195,def:def.tier===2?46:def.tier===1?40:34,
      range:def.tier===2?360:345,atkCd:1.05});
    this.type='turret';this.tier=def.tier;this.lane=def.lane;
  }
  acquire(){
    let bm=null,bmd=1e9,bc=null,bcd=1e9;
    for(const u of G.units){
      if(!u.alive||!isEnemy(this,u)||u.team===2)continue;
      const d=(u.x-this.x)**2+(u.y-this.y)**2;
      if(d>this.range*this.range)continue;
      if(u.type==='minion'){if(d<bmd){bmd=d;bm=u;}}
      else if(u.type==='champ'){
        /* 优先:正在攻击我方英雄的敌方英雄 */
        if(u.target&&u.target.type==='champ'&&u.target.team===this.team)return u;
        if(d<bcd){bcd=d;bc=u;}
      }
    }
    return bm||bc;
  }
  update(dt){
    if(this.dead)return;
    this.atkT-=dt;
    if(!this.target||this.target.dead||dist(this,this.target)>this.range+30)this.target=this.acquire();
    if(this.target&&this.atkT<=0)this.fireAt(this.target);
  }
}

class Monster extends Unit{
  constructor(camp,n){
    const d=MONSTER_DEF[camp.kind];
    super({team:2,x:camp.x,y:camp.y,r:d.r,maxhp:Math.round(d.hp*(1+.12*n)),
      ad:d.ad,def:d.def,spd:d.spd,range:d.range,atkCd:d.atkCd});
    this.type='monster';this.kind=camp.kind;this.camp=camp;this.respawnN=n;
    this.home={x:camp.x,y:camp.y};this.respawnT=0;this.goldv=d.gold;this.xpv=d.xp;
  }
  update(dt){
    if(this.dead){this.respawnT-=dt;
      if(this.respawnT<=0){this.dead=false;this.respawnN++;const d=MONSTER_DEF[this.kind];this.maxhp=Math.round(d.hp*(1+.12*this.respawnN));this.hp=this.maxhp;}
      return;}
    if(dist(this,this.home)>60&&G.t-this.lastCombat>4){this.moveTo(this.home.x,this.home.y,dt);this.hp=Math.min(this.maxhp,this.hp+this.maxhp*.1*dt);return;}
    this.atkT-=dt;
    if(!this.target||this.target.dead||dist(this,this.home)>430||dist(this,this.target)>460)this.target=null;
    if(!this.target){
      let best=null,bd=300*300;
      for(const u of G.units){if(u.alive&&u.type==='champ'&&isEnemy(this,u)){const d=(u.x-this.x)**2+(u.y-this.y)**2;if(d<bd){bd=d;best=u;}}}
      this.target=best;
    }
    if(this.target){
      const d=dist(this,this.target);
      if(d<=this.range+this.target.r*.5){if(this.atkT<=0)this.fireAt(this.target);}
      else this.moveTo(this.target.x,this.target.y,dt);
    }
  }
}

/* ---------- 伤害 / 击杀 ---------- */
function dealDamage(src,tgt,amt,kind,noText){
  if(!tgt||tgt.dead||G.over)return 0;
  const dv=tgt.type==='champ'?tgt.DEF():tgt.defVal();
  let v=amt*(1-(kind==='true'?0:dv/(dv+100+10*(tgt.level||1))));
  if(tgt.shield>0){const ab=Math.min(tgt.shield,v);tgt.shield-=ab;v-=ab;}
  tgt.hp-=v;
  tgt.lastCombat=G.t;if(src)src.lastCombat=G.t;
  if(tgt.type==='monster'&&src&&src.type==='champ')tgt.target=src;
  if(tgt.type==='champ'&&tgt.recallT>=0){tgt.recallT=-1;if(tgt.isPlayer)announce('回城被打断','red');}
  if(src&&src.type==='champ')src.dmg+=v;
  if(!noText&&((src&&src.isPlayer)||tgt.isPlayer)&&G.t-tgt.dmgTextT>.11){
    tgt.dmgTextT=G.t;
    addText(tgt.x+rand(-8,8),tgt.y-tgt.r-10,Math.round(v),
      src&&src.isPlayer?(kind==='magic'?'#8fc3ff':'#ffe9a8'):'#ff7d7d',src&&src.isPlayer?14:13);
  }
  if(tgt.hp<=0)killUnit(src,tgt);
  return v;
}
function teamGoldEach(team,amt,annTxt){
  for(const c of aliveChamps(team)){c.giveGold(amt);if(c.isPlayer)addText(c.x,c.y-40,'+'+amt,'#f0d489',12);}
}
function killUnit(src,tgt){
  if(tgt.dead)return;
  const killer=src&&src.type==='champ'?src:null;
  if(tgt.type==='minion'){
    tgt.dead=true;
    for(const c of champs()){
      if(c.team===tgt.team||c.dead)continue;
      const near=dist(c,tgt)<680;
      if(c===killer){c.giveGold(tgt.gold);c.cs++;if(c.isPlayer)addText(tgt.x,tgt.y-14,'+'+tgt.gold,'#f0d489',12);}
      else if(near)c.giveGold(Math.round(tgt.gold*.4));
      if(near||c===killer)c.giveXp(tgt.xpv);
    }
    addBurst(tgt.x,tgt.y,tgt.team===0?'#3f9bff':'#ff5252',6,110,2);
  }
  else if(tgt.type==='turret'){
    tgt.dead=true;
    G.rubble.push({x:tgt.x,y:tgt.y,tier:tgt.tier});
    teamGoldEach(tgt.team===0?1:0,125);
    announce((tgt.team===0?'蓝方':'红方')+'防御塔被摧毁','blue');
    killfeed(`${killer?nameTag(killer):TEAM_NAME[tgt.team===0?1:0]} 摧毁了 ${tgt.team===0?'<b class="b">蓝方</b>':'<b class="r">红方</b>'}防御塔`);
    Snd.tower();
  }
  else if(tgt.type==='nexus'){
    tgt.dead=true;endGame(tgt.team===0?1:0);
  }
  else if(tgt.type==='monster'){
    tgt.dead=true;tgt.respawnT=MONSTER_DEF[tgt.kind].respawn;
    addBurst(tgt.x,tgt.y,MONSTER_DEF[tgt.kind].col,24,220,4);
    const win=killer?killer.team:(src?src.team:0);
    if(tgt.kind==='golem'&&killer){killer.giveGold(tgt.goldv);killer.giveXp(tgt.xpv);
      if(killer.isPlayer)addText(tgt.x,tgt.y-20,'+'+tgt.goldv,'#f0d489',13);}
    else if(tgt.kind==='dragon'){
      G.buffs[win].drag=Math.min(3,G.buffs[win].drag+1);
      teamGoldEach(win,60);
      announce((win===0?'蓝方':'红方')+'击败了星耀巨龙!全队伤害提升','gold');
      killfeed(`${killer?nameTag(killer):TEAM_NAME[win]} 击败了 <b class="g">星耀巨龙</b>`);
      Snd.dragon();
    }
    else if(tgt.kind==='herald'){
      G.buffs[win].heraldUntil=G.t+45;
      teamGoldEach(win,45);
      announce((win===0?'蓝方':'红方')+'获得峡谷先锋之助!推塔增益 45 秒','gold');
      Snd.dragon();
    }
    /* 野怪经验:范围内英雄分享 */
    for(const c of aliveChamps())if(dist(c,tgt)<800)c.giveXp(60);
  }
  else if(tgt.type==='champ'){
    tgt.die();
    G.score[killer?killer.team:tgt.team===0?1:0]++;
    const bounty=tgt.bountyBase+38*tgt.level+Math.min(150,tgt.streak*35);
    if(killer){
      killer.kills++;killer.streak++;
      killer.giveGold(bounty);killer.giveXp(120+22*tgt.level);
      if(killer.isPlayer)addText(tgt.x,tgt.y-30,'+'+bounty,'#f0d489',15);
      if(!G.firstBlood){G.firstBlood=true;announce('第一滴血!','gold');}
      else if(killer.streak===2)announce((killer.isPlayer?'你达成了':killer.name+' 达成了')+'双杀!','gold');
      else if(killer.streak===3)announce((killer.isPlayer?'你达成了':killer.name+' 达成了')+'三杀!','gold');
      else if(killer.streak>=4)announce((killer.isPlayer?'你正在':killer.name+' 正在')+'大杀特杀!','gold');
    }
    for(const c of aliveChamps()){
      if(c.team===tgt.team||c===killer||dist(c,tgt)>950)continue;
      c.assists++;c.giveGold(Math.round(bounty*.45));
    }
    killfeed(`${killer?nameTag(killer):'<b>防御塔</b>'} 击败了 ${nameTag(tgt)} <span class="g">+${bounty}</span>`);
    if(tgt.isPlayer)announce('你已被击败','red');
    Snd.kill();if(tgt.isPlayer)Snd.death();
  }
}

/* ---------- 弹道 / 区域 ---------- */
function updProjs(dt){
  for(let i=G.projs.length-1;i>=0;i--){
    const p=G.projs[i];let hit=false;
    if(p.homing){
      const t=p.homing;
      if(t.dead){G.projs.splice(i,1);continue;}
      const dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy),st=p.spd*dt;
      if(d<=st+t.r*.5){
        dealDamage(p.src,t,p.dmg,p.kind);
        addBurst(t.x,t.y,p.col,5,120,2.4);
        if(p.src&&p.src.isPlayer)Snd.hit();
        hit=true;
      }else{p.x+=dx/d*st;p.y+=dy/d*st;}
    }else{
      p.x+=p.dx*p.spd*dt;p.y+=p.dy*p.spd*dt;p.traveled+=p.spd*dt;
      for(const u of G.units){
        if(!u.alive||u.team===p.team||u.team===2&&p.noMonster||p.hitIds.has(u.id))continue;
        if(u.team===2&&!p.hitMonster)continue;
        if((u.x-p.x)**2+(u.y-p.y)**2<(u.r+p.radius)**2){
          p.hitIds.add(u.id);
          dealDamage(p.src,u,p.dmg,p.kind);
          addBurst(u.x,u.y,p.col,5,120,2.4);
          if(!p.pierce){hit=true;break;}
        }
      }
      if(p.traveled>p.len)hit=true;
      if(p.x<0||p.x>WORLD||p.y<0||p.y>WORLD)hit=true;
    }
    if(hit)G.projs.splice(i,1);
  }
}
function updZones(dt){
  for(let i=G.zones.length-1;i>=0;i--){
    const z=G.zones[i];z.t+=dt;z.tickT-=dt;
    if(z.armT!==undefined&&!z.fired&&z.t>=z.armT){
      z.fired=true;
      for(const u of G.units){
        if(!u.alive||u.team===z.team||u.team===2)continue;
        if((u.x-z.x)**2+(u.y-z.y)**2<(z.r+u.r*.4)**2){
          dealDamage(z.src,u,z.dmg,z.kind||'magic');
          if(z.slowPct)u.applySlow(z.slowPct,z.slowDur||1);
        }
      }
      addBurst(z.x,z.y,z.col||'#9ec8ff',26,260,4);
      Snd.tower();
    }
    if(z.armT!==undefined&&z.t>=z.armT+.3){G.zones.splice(i,1);continue;}
    if(z.tickT<=0&&z.dmg&&!z.armT){
      z.tickT=z.tickEvery||.5;
      for(const u of G.units){
        if(!u.alive||u.team===z.team||u.team===2)continue;
        if((u.x-z.x)**2+(u.y-z.y)**2<(z.r+u.r*.4)**2){
          dealDamage(z.src,u,z.dmg,z.kind||'magic',true);
          if(z.slowPct)u.applySlow(z.slowPct,z.slowDur||1.2);
        }
      }
    }
    if(z.slowPct&&z.t<.05){ /* 立即施加一次减速 */ }
    if(z.t>=z.dur)G.zones.splice(i,1);
  }
}

/* ---------- 兵线 ---------- */
function spawnWave(){
  G.wave++;
  for(const team of[0,1])for(const lane of['top','mid','bot']){
    const comp=['melee','melee','melee','ranged','ranged'];
    if(G.wave%3===0)comp.push('siege');
    comp.forEach((k,i)=>{
      const m=new Minion(team,lane,G.wave,k,i*.7+team*.4);
      G.units.push(m);
    });
  }
}
/* 单位间软性排斥 */
function separation(){
  const us=G.units;
  for(let i=0;i<us.length;i++){
    const a=us[i];if(a.dead||a.type==='turret'||a.type==='nexus')continue;
    for(let j=i+1;j<us.length;j++){
      const b=us[j];if(b.dead||b.type==='turret'||b.type==='nexus')continue;
      const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r;
      if(Math.abs(dx)>rr||Math.abs(dy)>rr)continue;
      const d=Math.hypot(dx,dy);
      if(d>0.01&&d<rr){
        const push=(rr-d)/2,nx=dx/d,ny=dy/d;
        if(a.type!=='monster'){a.x-=nx*push*.6;a.y-=ny*push*.6;}
        if(b.type!=='monster'){b.x+=nx*push*.6;b.y+=ny*push*.6;}
      }
    }
  }
  for(const u of us){if(u.dead)continue;u.x=clamp(u.x,26,WORLD-26);u.y=clamp(u.y,26,WORLD-26);}
}

/* ================= PART 4 · 技能 / AI / 主循环 ================= */
function segDist(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,len=dx*dx+dy*dy;
  let t=len?((px-ax)*dx+(py-ay)*dy)/len:0;t=clamp(t,0,1);
  return Math.hypot(px-(ax+dx*t),py-(ay+dy*t));
}
function autoAim(ch,range){
  range=range||560;let best=null,bs=1e18;
  for(const u of G.units){
    if(!u.alive||u.team===ch.team)continue;
    const d=Math.hypot(u.x-ch.x,u.y-ch.y);
    if(d>range+40)continue;
    const rank=u.type==='champ'?0:u.type==='minion'?1:u.type==='monster'?2:3;
    const s=rank*1e7+d;
    if(s<bs){bs=s;best=u;}
  }
  let angle;
  if(ch.isPlayer&&input.mag>.2)angle=input.joyA;
  else if(best)angle=Math.atan2(best.y-ch.y,best.x-ch.x);
  else angle=ch.face;
  return {target:best,angle};
}
function lineProj(ch,angle,len,radius,dmg,kind,col,pierce){
  G.projs.push({x:ch.x,y:ch.y,dx:Math.cos(angle),dy:Math.sin(angle),spd:860,traveled:0,
    len,radius,dmg,kind,team:ch.team,src:ch,pierce:!!pierce,hitIds:new Set(),col,trail:[],hitMonster:true});
  addBurst(ch.x+Math.cos(angle)*24,ch.y+Math.sin(angle)*24,col,5,90,2);
}
function dashHitCharges(ch,a,len,dmg){
  const x2=ch.x+Math.cos(a)*len,y2=ch.y+Math.sin(a)*len;
  for(const u of G.units){
    if(!u.alive||u.team===ch.team)continue;
    if(segDist(u.x,u.y,ch.x,ch.y,x2,y2)<u.r+44)dealDamage(ch,u,dmg,'phys');
  }
}

function castSkill(ch,key){
  if(ch.dead||ch.dash||G.over)return false;
  const def=ch.cdef.skills[key];
  if(ch.level<def.lv||ch.cds[key]>0||ch.mana<def.mana)return false;
  const aim=autoAim(ch,key==='R'?680:560);
  const ok=SKILL_IMPL[ch.cid][key](ch,aim);
  if(ok===false)return false;
  ch.mana-=def.mana;ch.cds[key]=def.cd;ch.lastCombat=G.t;
  if(ch.isPlayer)Snd.skill('QWER'.indexOf(key));
  return true;
}

/* ---------- 英雄 AI ---------- */
function ownOuterTurret(team,lane){
  return G.units.find(u=>u.type==='turret'&&u.alive&&u.team===team&&u.lane===lane&&u.tier===0)
      || G.units.find(u=>u.type==='turret'&&u.alive&&u.team===team&&u.lane===lane);
}
function laneFrontier(ch){
  const own=ch.team,foe=NEXUS_POS[1-own];
  let best=null,bd=-1e18;
  for(const u of G.units){
    if(u.type!=='minion'||u.team!==own||u.lane!==ch.lane)continue;
    const d=-((foe.x-u.x)**2+(foe.y-u.y)**2);
    if(d>bd){bd=d;best=u;}
  }
  if(best){
    const d=Math.hypot(best.x-FOUNTAIN[own].x,best.y-FOUNTAIN[own].y)||1;
    return {x:best.x+(FOUNTAIN[own].x-best.x)/d*130,y:best.y+(FOUNTAIN[own].y-best.y)/d*130};
  }
  const t=ownOuterTurret(own,ch.lane);
  return t?{x:t.x,y:t.y}:{x:LANES[ch.lane][0].x,y:LANES[ch.lane][0].y};
}
function botBuy(ch){
  const list=BOT_BUY[ch.cdef.type];
  for(const id of list){
    if(ch.items.some(it=>it.id===id))continue;
    const it=ITEMS.find(i=>i.id===id);
    if(ch.gold>=it.cost){ch.gold-=it.cost;ch.items.push(it);ch.refresh();if(ch.hp>ch.maxhp)ch.hp=ch.maxhp;}
    break;
  }
}
function botCast(ch,e,nd){
  const S=k=>castSkill(ch,k),lvlOk=ch.level>=5;
  if(ch.cid==='kai'){
    if(lvlOk&&ch.cds.R<=0&&e.hp<e.maxhp*.62&&nd<430)S('R');
    else if(nd<210&&ch.cds.E<=0)S('E');
    else if(nd<440&&ch.cds.Q<=0)S('Q');
    if(ch.hp<ch.maxhp*.5&&ch.cds.W<=0)S('W');
  }else if(ch.cid==='aila'){
    if(lvlOk&&ch.cds.R<=0&&e.hp<e.maxhp*.72&&nd<520)S('R');
    else if(nd<580&&ch.cds.W<=0)S('W');
    else if(nd<560&&ch.cds.Q<=0)S('Q');
    if(ch.hp<ch.maxhp*.42&&ch.cds.E<=0&&nd<320)S('E');
  }else{
    if(lvlOk&&ch.cds.R<=0&&e.hp<e.maxhp*.58&&nd<680)S('R');
    else if(nd<540&&ch.cds.Q<=0)S('Q');
    else if(nd<500&&ch.cds.W<=0)S('W');
    if(nd<380&&ch.cds.E<=0)S('E');
  }
}
function botUpdate(ch,dt){
  if(ch.dead||ch.recallT>=0||ch.dash)return;
  botBuy(ch);
  const ai=ch.ai,f=FOUNTAIN[ch.team];
  /* 泉水疗养 */
  if(ai.mode==='heal'){
    if(ch.hp>ch.maxhp*.95&&ch.mana>ch.maxmana*.7)ai.mode='push';
    else{ch.moveTo(f.x,f.y,dt);return;}
  }
  if(ai.mode!=='heal'&&ch.hp<ch.maxhp*.28)ai.mode='retreat';
  /* 敌方英雄情报 */
  let nearE=null,nd=1e9;
  for(const e of aliveChamps(1-ch.team)){const d=dist(ch,e);if(d<nd){nd=d;nearE=e;}}
  if(ai.mode==='retreat'){
    if(nd<620&&nearE){ /* 被追,拉开距离边打边撤 */
      ch.moveTo(2*ch.x-nearE.x,2*ch.y-nearE.y,dt);
      botCast(ch,nearE,nd);
      return;
    }
    const df=dist(ch,f);
    if(df>620&&ch.recallT<0&&G.t-ch.lastCombat>1.5){ch.recallT=0;return;}
    ch.moveTo(f.x,f.y,dt);
    if(df<280)ai.mode='heal';
    return;
  }
  /* 目标兵线推进点 */
  const fr=laneFrontier(ch);
  /* 周边敌方威胁塔 */
  let dangerT=null;
  for(const u of G.units){
    if(u.type!=='turret'||!u.alive||u.team===ch.team)continue;
    if(dist(ch,u)<u.range+60){dangerT=u;break;}
  }
  /* 有敌方英雄接近 */
  if(nearE&&nd<560){
    const adv=ch.hp/ch.maxhp-nearE.hp/nearE.maxhp;
    const safeTower=!dangerT||nearE.hp<nearE.maxhp*.3;
    if(adv>-.14&&safeTower){
      botCast(ch,nearE,nd);
      ch.target=nearE;
      if(nd>ch.range*.92)ch.moveTo(nearE.x,nearE.y,dt);
      else if(ch.atkT<=0)ch.fireAt(nearE);
      return;
    }
    ch.moveTo(fr.x,fr.y,dt);
    return;
  }
  /* 塔下无兵不硬上 */
  if(dangerT){
    let alliedNear=false;
    for(const u of G.units){if(u.type==='minion'&&u.team===ch.team&&dist(u,dangerT)<dangerT.range+60){alliedNear=true;break;}}
    if(!alliedNear){
      const a=Math.atan2(ch.y-dangerT.y,ch.x-dangerT.x);
      ch.moveTo(ch.x+Math.cos(a)*120,ch.y+Math.sin(a)*120,dt);
      return;
    }
  }
  /* 推线:打最近的敌人(兵>塔) */
  let t=null,bd=1e9;
  for(const u of G.units){
    if(!u.alive||u.team===ch.team||u.team===2)continue;
    if(u.type!=='minion'&&u.type!=='turret'&&u.type!=='nexus')continue;
    const d=dist(ch,u);
    if(d<bd&&d<ch.range+320){bd=d;t=u;}
  }
  if(t){
    if(bd<=ch.range+t.r*.6){if(ch.atkT<=0)ch.fireAt(t);}
    else ch.moveTo(t.x,t.y,dt);
    return;
  }
  ch.moveTo(fr.x,fr.y,dt);
}

/* ---------- 玩家操控 ---------- */
function nearestEnemyIn(p,range,champFirst){
  let best=null,bs=1e18;
  for(const u of G.units){
    if(!u.alive||u.team===p.team)continue;
    const d=dist(p,u);
    if(d>range+u.r)continue;
    let rank=u.type==='champ'?0:u.type==='minion'?1:u.type==='turret'?2:u.type==='nexus'?2:3;
    if(!champFirst)rank=u.type==='minion'?0:u.type==='champ'?1:rank;
    const s=rank*1e7+d;
    if(s<bs){bs=s;best=u;}
  }
  return best;
}
function playerControl(dt){
  const p=G.player;
  if(!p||p.dead||G.over)return;
  if(p.recallT>=0&&input.mag>.2){p.recallT=-1;}
  if(p.dash)return;
  if(input.mag>.15){
    p.x+=Math.cos(input.joyA)*p.curSpd()*input.mag*dt;
    p.y+=Math.sin(input.joyA)*p.curSpd()*input.mag*dt;
    p.face=input.joyA;
    p.x=clamp(p.x,26,WORLD-26);p.y=clamp(p.y,26,WORLD-26);
  }else if(p.recallT<0){
    let t=(p.sticky&&p.sticky.alive&&dist(p,p.sticky)<p.range+p.sticky.r+60)?p.sticky:null;
    if(!t)t=nearestEnemyIn(p,p.range,true);
    if(t&&p.atkT<=0)p.fireAt(t);
  }
  if(input.aPress){
    input.aPress=false;
    const c=nearestEnemyIn(p,p.range+95,true);
    if(c){p.sticky=c;p.stickyT=3;if(p.atkT<=0)p.fireAt(c);}
    else{const m=nearestEnemyIn(p,p.range+40,false);if(m&&p.atkT<=0)p.fireAt(m);}
  }
}

/* ---------- 对局主循环 ---------- */
function updFx(dt){
  for(let i=G.texts.length-1;i>=0;i--){
    const t=G.texts[i];t.t+=dt;t.y-=30*dt;
    if(t.t>t.life)G.texts.splice(i,1);
  }
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.92;p.vy*=.92;
    if(p.t>p.life)G.parts.splice(i,1);
  }
}
function gameStep(dt){
  if(G.over)return;
  G.t+=dt;
  G.waveT-=dt;
  if(G.waveT<=0){G.waveT=WAVE_INT;spawnWave();}
  for(const b of G.buffs)if(b.heraldUntil&&G.t>b.heraldUntil)b.heraldUntil=0;
  for(const u of G.units)u.update(dt);
  for(const u of G.units)if(u.ai&&u.alive)botUpdate(u,dt);
  playerControl(dt);
  separation();
  updProjs(dt);
  updZones(dt);
  updFx(dt);
  G.units=G.units.filter(u=>!(u.dead&&u.type==='minion'));
  /* 摄像机跟随 */
  const p=G.player,s=G.cam;
  const k=1-Math.pow(.0015,dt);
  s.x=lerp(s.x,p.x,k);s.y=lerp(s.y,p.y,k);
}
function endGame(winner){
  if(G.over)return;
  G.over=true;G.winner=winner;
  setTimeout(()=>showEnd(),900);
  if(winner===0)Snd.win();else Snd.lose();
}

/* ================= PART 5 · 渲染 ================= */
const cv=$('game'),ctx=cv.getContext('2d');
const mmCv=$('minimap'),mmCtx=mmCv.getContext('2d');
let VW=0,VH=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=window.innerWidth;VH=window.innerHeight;
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  cv.style.width=VW+'px';cv.style.height=VH+'px';

}

/* ---------- 静态地图(预渲染一次) ---------- */
const MS=.5;
let mapCv=null;
function buildMap(){
  const c=document.createElement('canvas');
  c.width=WORLD*MS;c.height=WORLD*MS;
  const g=c.getContext('2d');
  g.scale(MS,MS);
  /* 草地基底 */
  g.fillStyle='#182a1e';g.fillRect(0,0,WORLD,WORLD);
  for(let i=0;i<420;i++){
    const x=rand(0,WORLD),y=rand(0,WORLD),r=rand(26,110);
    g.fillStyle=Math.random()<.5?'rgba(20,42,26,.5)':'rgba(32,56,36,.4)';
    g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
  }
  /* 双方阵营色渐染 */
  let gr=g.createLinearGradient(0,WORLD,WORLD,0);
  gr.addColorStop(0,'rgba(40,90,180,.10)');gr.addColorStop(.5,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(180,50,60,.10)');
  g.fillStyle=gr;g.fillRect(0,0,WORLD,WORLD);
  /* 河道 */
  g.strokeStyle='#1d4a49';g.lineWidth=150;g.lineCap='round';
  g.beginPath();g.moveTo(150,150);g.lineTo(2250,2250);g.stroke();
  g.strokeStyle='rgba(95,208,200,.14)';g.lineWidth=90;
  g.beginPath();g.moveTo(150,150);g.lineTo(2250,2250);g.stroke();
  /* 兵线土路 */
  g.lineJoin='round';g.lineCap='round';
  for(const ln of Object.values(LANES)){
    g.strokeStyle='#3d3a28';g.lineWidth=118;
    g.beginPath();g.moveTo(ln[0].x,ln[0].y);
    for(let i=1;i<ln.length;i++)g.lineTo(ln[i].x,ln[i].y);
    g.stroke();
    g.strokeStyle='rgba(90,82,54,.35)';g.lineWidth=80;
    g.beginPath();g.moveTo(ln[0].x,ln[0].y);
    for(let i=1;i<ln.length;i++)g.lineTo(ln[i].x,ln[i].y);
    g.stroke();
  }
  /* 泉水与基地 */
  for(const t of[0,1]){
    const f=FOUNTAIN[t],n=NEXUS_POS[t];
    g.fillStyle=t===0?'rgba(35,80,160,.30)':'rgba(160,45,55,.30)';
    g.beginPath();g.arc(f.x,f.y,300,0,TAU);g.fill();
    g.strokeStyle=t===0?'rgba(120,180,255,.5)':'rgba(255,140,140,.5)';g.lineWidth=5;
    g.beginPath();g.arc(f.x,f.y,300,0,TAU);g.stroke();
    g.fillStyle=t===0?'#22344e':'#3e2129';
    g.beginPath();g.arc(n.x,n.y,110,0,TAU);g.fill();
    g.strokeStyle=t===0?'#4a7dc4':'#c45a5a';g.lineWidth=4;
    g.beginPath();g.arc(n.x,n.y,110,0,TAU);g.stroke();
  }
  /* 草丛 */
  g.fillStyle='#123420';
  for(const b of[[560,470,90],[900,180,95],[1800,900,90],[2220,560,90],[470,1830,90],[1830,2225,85],[900,2220,90],[300,900,85]]){
    g.beginPath();g.ellipse(b[0],b[1],b[2],b[2]*.62,b[0]>b[1]?.8:-.8,0,TAU);g.fill();
  }
  /* 野怪营地 */
  for(const cp of CAMPS){
    g.fillStyle=cp.kind==='dragon'?'rgba(95,208,200,.13)':cp.kind==='herald'?'rgba(201,162,75,.12)':'rgba(141,123,176,.12)';
    g.beginPath();g.arc(cp.x,cp.y,cp.r+34,0,TAU);g.fill();
    g.strokeStyle='rgba(233,226,207,.15)';g.lineWidth=3;
    g.beginPath();g.arc(cp.x,cp.y,cp.r+34,0,TAU);g.stroke();
  }
  /* 防御塔底座 */
  for(const td of TURRET_DEFS){
    g.fillStyle='rgba(0,0,0,.25)';
    g.beginPath();g.arc(td.x,td.y+8,34,0,TAU);g.fill();
    g.fillStyle=td.t===0?'#25344c':'#3f2730';
    g.beginPath();g.arc(td.x,td.y,30,0,TAU);g.fill();
    g.strokeStyle=td.t===0?'#4a7dc4':'#c45a5a';g.lineWidth=3;
    g.beginPath();g.arc(td.x,td.y,30,0,TAU);g.stroke();
  }
  /* 世界边界 */
  g.strokeStyle='rgba(201,162,75,.35)';g.lineWidth=10;
  g.strokeRect(14,14,WORLD-28,WORLD-28);
  return c;
}

/* ---------- 通用绘制 ---------- */
function bar(g,x,y,w,h,pct,col,bg){
  g.fillStyle=bg||'rgba(8,10,16,.8)';g.fillRect(x-1,y-1,w+2,h+2);
  g.fillStyle=col;g.fillRect(x,y,w*clamp(pct,0,1),h);
}
function drawChampBody(g,x,y,r,cid,team,face,t,glow){
  const d=CHAMPS[cid];
  /* 影子 */
  g.fillStyle='rgba(0,0,0,.35)';
  g.beginPath();g.ellipse(x,y+r*.75,r*.95,r*.42,0,0,TAU);g.fill();
  /* 阵营环 + 本体 */
  g.beginPath();g.arc(x,y,r,0,TAU);
  g.fillStyle=d.body;g.fill();
  g.lineWidth=3.5;
  g.strokeStyle=team===-1?'#c9a24b':TEAM_COL[team];
  g.stroke();
  if(glow){
    g.save();g.shadowColor=glow;g.shadowBlur=14;
    g.beginPath();g.arc(x,y,r,0,TAU);g.strokeStyle=glow;g.lineWidth=2;g.stroke();g.restore();
  }
  /* 朝向楔形(武器示意) */
  const fx=x+Math.cos(face)*r*.78,fy=y+Math.sin(face)*r*.78;
  g.save();g.translate(fx,fy);g.rotate(face);
  g.fillStyle=d.col;
  if(cid==='kai'){g.fillRect(-3,-2.4,15,4.8);}          /* 剑 */
  else if(cid==='aila'){g.beginPath();g.arc(9,0,4.6,0,TAU);g.fill();g.fillRect(-4,-1.6,9,3.2);} /* 法杖 */
  else{g.beginPath();g.arc(2,0,7.5,-1.25,1.25);g.lineWidth=3;g.strokeStyle=d.col;g.stroke();}   /* 弓 */
  g.restore();
  /* 高光 */
  g.fillStyle='rgba(255,255,255,.16)';
  g.beginPath();g.arc(x-r*.3,y-r*.34,r*.34,0,TAU);g.fill();
}

function drawWorld(){
  const s=G.cam.scale,cx=G.cam.x,cy=G.cam.y;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#070a10';ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(DPR*s,0,0,DPR*s,DPR*(VW/2-cx*s),DPR*(VH/2-cy*s));
  const vx0=cx-VW/2/s-120,vx1=cx+VW/2/s+120,vy0=cy-VH/2/s-120,vy1=cy+VH/2/s+120;
  const inView=u=>u.x>vx0&&u.x<vx1&&u.y>vy0&&u.y<vy1;
  ctx.drawImage(mapCv,0,0,mapCv.width,mapCv.height,0,0,WORLD,WORLD);
  /* 塔废墟 */
  for(const rb of G.rubble){
    ctx.fillStyle='rgba(20,22,30,.6)';
    ctx.beginPath();ctx.arc(rb.x,rb.y,20,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(120,110,90,.4)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(rb.x-12,rb.y+6);ctx.lineTo(rb.x+10,rb.y-8);ctx.stroke();
  }
  /* 技能区域 */
  for(const z of G.zones){
    const a=z.armT!==undefined?z.t/z.armT:z.t/z.dur;
    if(z.tele){
      ctx.strokeStyle='rgba(158,200,255,.8)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.stroke();
      ctx.fillStyle='rgba(158,200,255,.16)';
      ctx.beginPath();ctx.arc(z.x,z.y,z.r*Math.min(1,z.t/z.armT),0,TAU);ctx.fill();
    }else if(z.ring){
      ctx.strokeStyle=z.col;ctx.globalAlpha=1-z.t/z.dur;ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(z.x,z.y,z.r*(0.4+0.6*z.t/z.dur),0,TAU);ctx.stroke();
      ctx.globalAlpha=1;
    }else{
      ctx.fillStyle=z.col;ctx.globalAlpha=.13+.05*Math.sin(G.t*8);
      ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.fill();
      ctx.globalAlpha=.55;ctx.strokeStyle=z.col;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  /* 敌方塔攻击范围提示 */
  for(const u of G.units){
    if(u.type==='turret'&&u.alive&&u.team!==0&&inView(u)){
      ctx.strokeStyle='rgba(255,82,82,.10)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(u.x,u.y,u.range,0,TAU);ctx.stroke();
    }
  }
  /* 水晶 */
  for(const u of G.units){
    if(u.type!=='nexus'||!inView(u))continue;
    const pl=1+.06*Math.sin(G.t*2.4);
    ctx.save();ctx.translate(u.x,u.y);ctx.rotate(G.t*.35);
    ctx.shadowColor=TEAM_COL[u.team];ctx.shadowBlur=26;
    ctx.fillStyle=u.team===0?'#3f9bff':'#ff5252';
    ctx.beginPath();ctx.moveTo(0,-40*pl);ctx.lineTo(28*pl,0);ctx.lineTo(0,40*pl);ctx.lineTo(-28*pl,0);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath();ctx.moveTo(0,-40*pl);ctx.lineTo(28*pl,0);ctx.lineTo(0,0);ctx.closePath();ctx.fill();
    ctx.restore();
    bar(ctx,u.x-42,u.y-66,84,8,u.hp/u.maxhp,u.team===0?'#39d353':'#ff5252');
  }
  /* 防御塔 */
  for(const u of G.units){
    if(u.type!=='turret'||!u.alive||!inView(u))continue;
    ctx.fillStyle='#2b3242';
    ctx.beginPath();ctx.arc(u.x,u.y,u.r+8,0,TAU);ctx.fill();
    ctx.strokeStyle=TEAM_COL[u.team];ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(u.x,u.y,u.r+8,0,TAU);ctx.stroke();
    ctx.save();ctx.translate(u.x,u.y);ctx.rotate(Math.PI/4+G.t*.5);
    ctx.shadowColor=TEAM_COL[u.team];ctx.shadowBlur=12;
    ctx.fillStyle=TEAM_COL[u.team];
    ctx.fillRect(-9,-9,18,18);
    ctx.restore();
    if(u.hp<u.maxhp)bar(ctx,u.x-30,u.y-52,60,7,u.hp/u.maxhp,u.team===0?'#39d353':'#ff5252');
  }
  /* 野怪 */
  for(const u of G.units){
    if(u.type!=='monster'||u.dead||!inView(u))continue;
    const d=MONSTER_DEF[u.kind];
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(u.x,u.y+u.r*.7,u.r,u.r*.4,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(u.x,u.y,u.r,0,TAU);
    ctx.fillStyle=d.col;ctx.fill();
    ctx.strokeStyle='rgba(233,226,207,.5)';ctx.lineWidth=2.5;ctx.stroke();
    /* 眼睛 */
    ctx.fillStyle='#0b0f17';
    ctx.beginPath();ctx.arc(u.x-u.r*.3,u.y-u.r*.2,3,0,TAU);ctx.arc(u.x+u.r*.3,u.y-u.r*.2,3,0,TAU);ctx.fill();
    if(u.hp<u.maxhp)bar(ctx,u.x-24,u.y-u.r-14,48,6,u.hp/u.maxhp,'#d9a24b');
    if(u.kind!=='golem'){
      ctx.fillStyle='rgba(233,226,207,.75)';
      ctx.font='11px sans-serif';ctx.textAlign='center';
      ctx.fillText(d.nm,u.x,u.y-u.r-20);
    }
  }
  /* 小兵 */
  for(const u of G.units){
    if(u.type!=='minion'||u.dead||!inView(u))continue;
    const col=u.team===0?'#5b9bff':'#ff7d7d';
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.beginPath();ctx.ellipse(u.x,u.y+u.r*.6,u.r*.9,u.r*.36,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(u.x,u.y,u.r,0,TAU);
    ctx.fillStyle=u.kind==='siege'?(u.team===0?'#3d6fd9':'#d94a4a'):col;ctx.fill();
    ctx.strokeStyle='rgba(8,10,16,.55)';ctx.lineWidth=2;ctx.stroke();
    if(u.hp<u.maxhp)bar(ctx,u.x-14,u.y-u.r-9,28,4,u.hp/u.maxhp,u.team===0?'#39d353':'#ff5252');
  }
  /* 弹道 */
  for(const p of G.projs){
    ctx.save();ctx.shadowColor=p.col;ctx.shadowBlur=9;
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.homing?6:4.5,0,TAU);ctx.fill();
    ctx.restore();
    let dx,dy;
    if(p.homing){dx=p.x-(p.trailX||p.x);dy=p.y-(p.trailY||p.y);}
    else{dx=p.dx;dy=p.dy;}
    const dl=Math.hypot(dx,dy);
    if(dl>.1){
      ctx.strokeStyle=p.col;ctx.globalAlpha=.5;ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-dx/dl*30,p.y-dy/dl*30);ctx.stroke();
      ctx.globalAlpha=1;
    }
    p.trailX=p.x;p.trailY=p.y;
  }
  /* 英雄 */
  for(const u of G.units){
    if(u.type!=='champ'||u.dead||!inView(u))continue;
    drawChampBody(ctx,u.x,u.y,u.r,u.cid,u.team,u.face,G.t,u.isPlayer?'#f0d489':null);
    /* 减速标记 */
    if(u.slowT>G.t){
      ctx.strokeStyle='rgba(125,180,255,.7)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(u.x,u.y,u.r+6,G.t*3,G.t*3+2.2);ctx.stroke();
    }
    if(u.shield>0){
      ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(u.x,u.y,u.r+7,0,TAU);ctx.stroke();
    }
    /* 回城引导 */
    if(u.recallT>=0){
      const p=u.recallT/3.4;
      ctx.strokeStyle='#f0d489';ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(u.x,u.y,u.r+13,-Math.PI/2,-Math.PI/2+p*TAU);ctx.stroke();
    }
    /* 等级徽章 */
    ctx.fillStyle='#101724';ctx.strokeStyle='#c9a24b';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(u.x-u.r-11,u.y+u.r+2,9,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle='#f0d489';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(u.level,u.x-u.r-11,u.y+u.r+3);
    /* 血条 / 蓝条 */
    const bw=54;
    ctx.fillStyle='rgba(8,10,16,.75)';ctx.fillRect(u.x-bw/2-1,u.y-u.r-30,bw+2,14);
    bar(ctx,u.x-bw/2,u.y-u.r-29,bw,5.5,u.hp/u.maxhp,u.team===0?'#39d353':'#ff5252');
    if(u.shield>0)bar(ctx,u.x-bw/2,u.y-u.r-29,bw*Math.min(1,u.shield/u.maxhp),5.5,'rgba(255,255,255,.75)');
    bar(ctx,u.x-bw/2,u.y-u.r-22.5,bw,3,u.mana/u.maxmana,'#2f7fd6');
    ctx.font='11px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillStyle=u.isPlayer?'#ffe9a8':'rgba(233,226,207,.85)';
    ctx.fillText(u.name,u.x,u.y-u.r-34);
  }
  /* 玩家普攻范围 */
  const pl=G.player;
  if(pl&&pl.alive&&!pl.dead&&input.mag<=.15){
    ctx.strokeStyle='rgba(233,226,207,.08)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(pl.x,pl.y,pl.range+pl.r*.5,0,TAU);ctx.stroke();
  }
  /* 粒子 */
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  /* 飘字 */
  ctx.textAlign='center';
  for(const t of G.texts){
    ctx.globalAlpha=Math.max(0,1-t.t/t.life);
    ctx.font=`bold ${t.size}px "Microsoft YaHei",sans-serif`;
    ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=3;
    ctx.strokeText(t.txt,t.x,t.y);
    ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;
}

/* ---------- 小地图 ---------- */
function drawMinimap(){
  const S=138,k=S/WORLD;
  mmCtx.setTransform(1,0,0,1,0,0);
  mmCtx.fillStyle='#0d1420';mmCtx.fillRect(0,0,S,S);
  mmCtx.strokeStyle='rgba(201,162,75,.25)';mmCtx.lineWidth=1;
  mmCtx.strokeRect(.5,.5,S-1,S-1);
  mmCtx.strokeStyle='rgba(95,208,200,.3)';mmCtx.lineWidth=3;
  mmCtx.beginPath();mmCtx.moveTo(8,8);mmCtx.lineTo(S-8,S-8);mmCtx.stroke();
  mmCtx.strokeStyle='rgba(120,110,70,.5)';mmCtx.lineWidth=4;
  for(const ln of Object.values(LANES)){
    mmCtx.beginPath();mmCtx.moveTo(ln[0].x*k,ln[0].y*k);
    for(let i=1;i<ln.length;i++)mmCtx.lineTo(ln[i].x*k,ln[i].y*k);
    mmCtx.stroke();
  }
  for(const u of G.units){
    const x=u.x*k,y=u.y*k;
    if(u.type==='nexus'){
      mmCtx.fillStyle=u.alive?TEAM_COL[u.team]:'#3a3a3a';
      mmCtx.save();mmCtx.translate(x,y);mmCtx.rotate(Math.PI/4);
      mmCtx.fillRect(-4,-4,8,8);mmCtx.restore();
    }else if(u.type==='turret'&&u.alive){
      mmCtx.fillStyle=TEAM_COL[u.team];
      mmCtx.fillRect(x-2.5,y-2.5,5,5);
    }else if(u.type==='monster'&&!u.dead){
      mmCtx.fillStyle=u.kind==='dragon'?'#5fd0c8':'rgba(201,162,75,.8)';
      mmCtx.beginPath();mmCtx.arc(x,y,u.kind==='dragon'?3.5:2.2,0,TAU);mmCtx.fill();
    }else if(u.type==='champ'&&u.alive){
      mmCtx.fillStyle=TEAM_COL[u.team];
      mmCtx.beginPath();mmCtx.arc(x,y,3.6,0,TAU);mmCtx.fill();
      if(u.isPlayer){
        mmCtx.strokeStyle='#fff';mmCtx.lineWidth=1.6;
        mmCtx.beginPath();mmCtx.arc(x,y,5,0,TAU);mmCtx.stroke();
      }
    }
  }
  /* 视野框 */
  const s=G.cam.scale;
  mmCtx.strokeStyle='rgba(233,226,207,.35)';mmCtx.lineWidth=1;
  mmCtx.strokeRect((G.cam.x-VW/2/s)*k,(G.cam.y-VH/2/s)*k,VW/s*k,VH/s*k);
}

/* ================= PART 6 · 输入 / 商店 / 流程 ================= */
const input={mag:0,joyA:0,aPress:false,pid:null,ox:0,oy:0};
const joyBase=$('joyBase'),joyKnob=$('joyKnob');
const JOY_MAX=34;
function joyStart(x,y){
  input.ox=x;input.oy=y;
  joyBase.style.display='block';
  joyBase.style.left=(x-59)+'px';joyBase.style.top=(y-59)+'px';
  $('joyHint').style.display='none';
  joyMove(x,y);
}
function joyMove(x,y){
  const dx=x-input.ox,dy=y-input.oy,d=Math.hypot(dx,dy);
  if(d>10){input.joyA=Math.atan2(dy,dx);input.mag=Math.min(1,(d-6)/38);}
  else input.mag=0;
  const kd=Math.min(d,JOY_MAX),nx=d?dx/d:0,ny=d?dy/d:0;
  joyKnob.style.left=(33+nx*kd)+'px';
  joyKnob.style.top=(33+ny*kd)+'px';
}
function joyEnd(){
  input.pid=null;input.mag=0;
  joyBase.style.display='none';
  joyKnob.style.left='33px';joyKnob.style.top='33px';
}
cv.addEventListener('pointerdown',e=>{
  if(!G||G.over||input.pid!==null)return;
  input.pid=e.pointerId;joyStart(e.clientX,e.clientY);
});
window.addEventListener('pointermove',e=>{if(e.pointerId===input.pid)joyMove(e.clientX,e.clientY);});
window.addEventListener('pointerup',e=>{if(e.pointerId===input.pid)joyEnd();});
window.addEventListener('pointercancel',e=>{if(e.pointerId===input.pid)joyEnd();});
window.addEventListener('contextmenu',e=>e.preventDefault());

/* 技能按钮 */
const skillEls={Q:$('skQ'),W:$('skW'),E:$('skE'),R:$('skR')};
function pressSkill(k){
  if(!G||G.over)return;
  const p=G.player;
  if(p.dead)return;
  if(k==='A'){input.aPress=true;return;}
  castSkill(p,k);
}
for(const k of['Q','W','E','R']){
  skillEls[k].addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pressSkill(k);});
}
$('skA').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pressSkill('A');});
$('btnRecall').addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!G||G.over)return;
  const p=G.player;
  if(p.dead||p.recallT>=0)return;
  if(dist(p,FOUNTAIN[0])<300)return;
  p.recallT=0;Snd.recall();
});
$('btnMute').addEventListener('pointerdown',e=>{
  e.preventDefault();
  $('btnMute').textContent=Snd.toggle()?'♪':'∅';
});

/* ---------- 商店 ---------- */
let shopOpen=false,invLen=-1;
function toggleShop(force){
  shopOpen=force!==undefined?force:!shopOpen;
  $('shop').classList.toggle('hidden',!shopOpen);
  if(shopOpen)updateShop();
}
$('btnShop').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();Snd.unlock();toggleShop();});
$('shopClose').addEventListener('pointerdown',e=>{e.preventDefault();toggleShop(false);});
function buildShop(){
  const list=$('shopList');list.innerHTML='';
  for(const it of ITEMS){
    const row=document.createElement('div');
    row.className='sitem';row.dataset.id=it.id;
    row.innerHTML=`<div class="ico">${it.ico}</div><div class="info"><div class="nm">${it.nm}</div><div class="st">${it.desc}</div></div><button>购买</button>`;
    row.querySelector('button').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();buyItem(it.id);});
    list.appendChild(row);
  }
}
function buyItem(id){
  const p=G.player,it=ITEMS.find(i=>i.id===id);
  if(!it||p.items.some(x=>x.id===id)||p.gold<it.cost||p.items.length>=6)return;
  p.gold-=it.cost;p.items.push(it);p.refresh();
  Snd.gold();updateInv();updateShop();
  addText(p.x,p.y-46,it.nm,'#f0d489',13);
}
function updateShop(){
  const p=G.player;
  $('shopGold').textContent='金币 '+Math.floor(p.gold);
  for(const row of $('shopList').children){
    const it=ITEMS.find(i=>i.id===row.dataset.id);
    const owned=p.items.some(x=>x.id===it.id);
    row.classList.toggle('owned',owned);
    const btn=row.querySelector('button');
    btn.disabled=owned||p.gold<it.cost||p.items.length>=6;
    btn.textContent=owned?'已购':'购买';
  }
  const n=ITEMS.filter(it=>!p.items.some(x=>x.id===it.id)&&p.gold>=it.cost&&p.items.length<6).length;
  const bd=$('shopBadge');
  bd.style.display=n>0?'flex':'none';bd.textContent=n;
}
function updateInv(){
  const p=G.player;
  if(p.items.length===invLen)return;
  invLen=p.items.length;
  $('invbar').innerHTML=Array.from({length:6},(_,i)=>{
    const it=p.items[i];
    return `<div class="islot" title="${it?it.nm+' · '+it.desc:''}">${it?it.ico:''}</div>`;
  }).join('');
}

/* ---------- HUD 刷新 ---------- */
const hudCache={};
function setTxt(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;}}
let shopT=0;
function updateHUD(dt){
  const p=G.player;
  setTxt('scoreB',G.score[0]);setTxt('scoreR',G.score[1]);
  setTxt('clock',fmtT(G.t));
  setTxt('myLv',p.level);
  setTxt('myGold','◆ '+Math.floor(p.gold));
  const kda=`<b>${p.kills}</b>/${p.deaths}/${p.assists}`;
  if(hudCache.kda!==kda){hudCache.kda=kda;$('myKda').innerHTML=kda;}
  for(const key of['Q','W','E','R']){
    const el=skillEls[key],def=p.cdef.skills[key],cd=p.cds[key];
    const mask=el.querySelector('.cdmask'),sec=el.querySelector('.cdsec'),cost=el.querySelector('.cost'),nm=el.querySelector('.nm');
    if(nm.textContent!==def.nm)nm.textContent=def.nm;
    cost.textContent=def.mana;
    if(p.level<def.lv){
      el.classList.add('lockR');el.classList.remove('dim');
      mask.style.display='none';sec.style.display='none';
      sec.textContent='Lv'+def.lv;
      continue;
    }
    el.classList.remove('lockR');
    if(cd>0){
      mask.style.display='block';sec.style.display='block';
      mask.style.background=`conic-gradient(rgba(8,10,16,.82) ${cd/def.cd*360}deg, transparent 0deg)`;
      sec.textContent=cd>=1?Math.ceil(cd):cd.toFixed(1);
    }else{mask.style.display='none';sec.style.display='none';}
    el.classList.toggle('dim',p.mana<def.mana);
  }
  const cn=$('centerNote');
  if(p.dead){
    cn.classList.remove('hidden');
    cn.innerHTML=`<div class="t1">复活中 ${Math.ceil(p.respawnT)} 秒</div><div class="t2">等级 ${p.level} · 稍安勿躁,泉水见</div>`;
  }else if(p.recallT>=0){
    cn.classList.remove('hidden');
    cn.innerHTML=`<div class="t1">回城中 ${(3.4-p.recallT).toFixed(1)} 秒</div><div class="t2">移动或受到伤害会打断回城</div>`;
  }else cn.classList.add('hidden');
  updateInv();
  shopT-=dt||0;
  if(shopOpen&&shopT<=0){shopT=.4;updateShop();}
}

/* ---------- 选人界面 ---------- */
let selCid=null;
const cardList=[];
function initSelect(){
  const wrap=$('cards');
  for(const cid of Object.keys(CHAMPS)){
    const d=CHAMPS[cid];
    const card=document.createElement('div');
    card.className='card';
    const sk=Object.entries(d.skills).map(([k,v])=>`<span class="sk">${k==='R'?'<b class="g">':''}${k} ${v.nm}${k==='R'?'</b>':''}</span>`).join(' · ');
    card.innerHTML=`<canvas width="150" height="128"></canvas>
      <div class="cname">${d.name}</div>
      <div class="crole">${d.role} · ${d.type==='ad'?'物理输出':'法术输出'}</div>
      <div class="ctags">${sk}</div>`;
    card.addEventListener('pointerdown',()=>{
      Snd.unlock();
      selCid=cid;
      for(const c of wrap.children)c.classList.toggle('sel',c===card);
      $('btnStart').classList.add('ready');
      Snd.gold();
    });
    wrap.appendChild(card);
    cardList.push({cv:card.querySelector('canvas'),cid});
  }
  cardLoop(0);
}
function cardLoop(now){
  if($('select').classList.contains('hidden'))return;
  const t=now/1000;
  for(const c of cardList){
    const g=c.cv.getContext('2d'),w=c.cv.width,h=c.cv.height;
    g.clearRect(0,0,w,h);
    const gr=g.createRadialGradient(w/2,h*.5,8,w/2,h*.5,w*.62);
    gr.addColorStop(0,'rgba(63,155,255,.14)');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(0,0,w,h);
    drawChampBody(g,w/2,h*.52,38,c.cid,-1,-.5+Math.sin(t*1.1+c.cid.length)*.4,t);
    g.fillStyle='rgba(233,226,207,.32)';
    g.font='11px "Microsoft YaHei",sans-serif';g.textAlign='center';
    g.fillText(CHAMPS[c.cid].role,w/2,h-8);
  }
  requestAnimationFrame(cardLoop);
}

/* ---------- 开局 / 主循环 / 结算 ---------- */
let running=false,last=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  Snd.unlock();
  G=newGame(selCid);
  mapCv=buildMap();
  /* 我方:玩家中路 + 随机双队友 */
  const p=new Champion(selCid,0,CHAMPS[selCid].name,true,'mid');
  G.player=p;G.units.push(p);
  const rest=shuffle(['kai','aila','sya'].filter(c=>c!==selCid));
  G.units.push(new Champion(rest[0],0,BOT_NAMES.ally[rest[0]],false,'top'));
  G.units.push(new Champion(rest[1],0,BOT_NAMES.ally[rest[1]],false,'bot'));
  /* 敌方三人各守一线 */
  const foes=shuffle(['kai','aila','sya']);
  ['top','mid','bot'].forEach((ln,i)=>{
    G.units.push(new Champion(foes[i],1,BOT_NAMES.enemy[foes[i]],false,ln));
  });
  /* 建筑 & 野怪 */
  for(const td of TURRET_DEFS)G.units.push(new Turret(td));
  G.units.push(new Nexus(0),new Nexus(1));
  for(const cp of CAMPS)G.units.push(new Monster(cp,0));
  resize();
  G.cam.x=p.x;G.cam.y=p.y;
  buildShop();updateInv();
  $('select').classList.add('hidden');
  $('hud').classList.remove('hidden');
  setTimeout(()=>announce('欢迎来到星耀峡谷','gold'),300);
  setTimeout(()=>announce('摧毁敌方水晶即可获胜','blue'),2100);
  running=true;last=performance.now();
  requestAnimationFrame(frame);
}
function frame(now){
  if(!running)return;
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt<=0)return;
  dt=Math.min(dt,.05);
  gameStep(dt);
  drawWorld();
  drawMinimap();
  updateHUD(dt);
}
function showEnd(){
  const win=G.winner===0;
  const et=$('endTitle');
  et.textContent=win?'胜 利':'败 北';
  et.className=win?'win':'lose';
  $('endSub').textContent=(win?'蓝方摧毁了敌方水晶':'红方摧毁了蓝方水晶')+' · 对局时长 '+fmtT(G.t);
  const rows=champs().slice().sort((a,b)=>a.team-b.team||(b.kills-a.kills));
  let html='<table><tr><th>英雄</th><th>阵营</th><th>击杀 / 死亡 / 助攻</th><th>补刀</th><th>金币</th><th>输出</th></tr>';
  for(const c of rows){
    html+=`<tr><td class="${c.isPlayer?'me':''}">${c.name}${c.isPlayer?' (你)':''}</td>`
      +`<td class="${c.team===0?'bb':'rr'}">${TEAM_NAME[c.team]}</td>`
      +`<td>${c.kills} / ${c.deaths} / ${c.assists}</td><td>${c.cs}</td>`
      +`<td>${Math.floor(c.gold)}</td><td>${Math.round(c.dmg)}</td></tr>`;
  }
  $('endStats').innerHTML=html+'</table>';
  $('endscr').classList.remove('hidden');
}
$('btnStart').addEventListener('pointerdown',e=>{e.preventDefault();if(selCid)startGame();});
$('btnAgain').addEventListener('pointerdown',e=>{e.preventDefault();location.reload();});

/* ---------- 启动 ---------- */
resize();
initSelect();

</script>
