  for(const rb of G.rubble){
    ctx.fillStyle='rgba(20,22,30,.6)';
    ctx.beginPath();ctx.arc(rb.x,rb.y,20,0,TAU);ctx.fill();
    ctx.strokeStyle='rgba(120,110,90,.4)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(rb.x-12,rb.y+6);ctx.lineTo(rb.x+10,rb.y-8);ctx.stroke();
  }
  /* 技能区域 */
  for(const z of G.zones){
    const a=z.armT!==undefined?z.t/z.armT:z.t/z.dur;
    if(z.tele){
      ctx.strokeStyle='rgba(158,200,255,.8)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.stroke();
      ctx.fillStyle='rgba(158,200,255,.16)';
      ctx.beginPath();ctx.arc(z.x,z.y,z.r*Math.min(1,z.t/z.armT),0,TAU);ctx.fill();
    }else if(z.ring){
      ctx.strokeStyle=z.col;ctx.globalAlpha=1-z.t/z.dur;ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(z.x,z.y,z.r*(0.4+0.6*z.t/z.dur),0,TAU);ctx.stroke();
      ctx.globalAlpha=1;
    }else{
      ctx.fillStyle=z.col;ctx.globalAlpha=.13+.05*Math.sin(G.t*8);
      ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.fill();
      ctx.globalAlpha=.55;ctx.strokeStyle=z.col;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,TAU);ctx.stroke();
      ctx.globalAlpha=1;
    }
  }
  /* 敌方塔攻击范围提示 */
  for(const u of G.units){
    if(u.type==='turret'&&u.alive&&u.team!==0&&inView(u)){
      ctx.strokeStyle='rgba(255,82,82,.10)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(u.x,u.y,u.range,0,TAU);ctx.stroke();
    }
  }
  /* 水晶 */
  for(const u of G.units){
    if(u.type!=='nexus'||!inView(u))continue;
    const pl=1+.06*Math.sin(G.t*2.4);
    ctx.save();ctx.translate(u.x,u.y);ctx.rotate(G.t*.35);
    ctx.shadowColor=TEAM_COL[u.team];ctx.shadowBlur=26;
    ctx.fillStyle=u.team===0?'#3f9bff':'#ff5252';
    ctx.beginPath();ctx.moveTo(0,-40*pl);ctx.lineTo(28*pl,0);ctx.lineTo(0,40*pl);ctx.lineTo(-28*pl,0);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath();ctx.moveTo(0,-40*pl);ctx.lineTo(28*pl,0);ctx.lineTo(0,0);ctx.closePath();ctx.fill();
    ctx.restore();
    /* 环绕水晶碎片 */
    for(let i=0;i<3;i++){
      const sa=G.t*1.4+i*TAU/3;
      const sx=u.x+Math.cos(sa)*62,sy=u.y+Math.sin(sa)*62;
      ctx.save();ctx.translate(sx,sy);ctx.rotate(sa+G.t);
      ctx.fillStyle=u.team===0?'rgba(120,180,255,.8)':'rgba(255,140,140,.8)';
      ctx.fillRect(-6,-6,12,12);
      ctx.restore();
    }
    bar(ctx,u.x-42,u.y-78,84,8,u.hp/u.maxhp,u.team===0?'#39d353':'#ff5252');
  }
  /* 防御塔 */
  for(const u of G.units){
    if(u.type!=='turret'||!u.alive||!inView(u))continue;
    const tc=TEAM_COL[u.team];
    ctx.fillStyle='rgba(20,24,34,.9)';
    ctx.beginPath();ctx.ellipse(u.x,u.y+20,26,10,0,0,TAU);ctx.fill();
    ctx.fillStyle='#39404f';
    ctx.beginPath();
    ctx.moveTo(u.x-20,u.y+18);ctx.lineTo(u.x-13,u.y-30);
    ctx.lineTo(u.x+13,u.y-30);ctx.lineTo(u.x+20,u.y+18);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle=tc;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.08)';
    ctx.fillRect(u.x-13,u.y-30,7,48);
    ctx.save();ctx.translate(u.x,u.y-38);ctx.rotate(Math.PI/4+Math.sin(G.t*2+u.x)*.2);
    ctx.shadowColor=tc;ctx.shadowBlur=16;
    ctx.fillStyle=tc;ctx.fillRect(-9,-9,18,18);
    ctx.restore();
    if(u.hp<u.maxhp)bar(ctx,u.x-30,u.y-64,60,7,u.hp/u.maxhp,u.team===0?'#39d353':'#ff5252');
  }
  /* 野怪 */
  for(const u of G.units){
    if(u.type!=='monster'||u.dead||!inView(u))continue;
    const d=MONSTER_DEF[u.kind];
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(u.x,u.y+u.r*.7,u.r,u.r*.4,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(u.x,u.y,u.r,0,TAU);
    ctx.fillStyle=d.col;ctx.fill();
    ctx.strokeStyle='rgba(233,226,207,.5)';ctx.lineWidth=2.5;ctx.stroke();
    /* 眼睛 */
    ctx.fillStyle='#0b0f17';
    ctx.beginPath();ctx.arc(u.x-u.r*.3,u.y-u.r*.2,3,0,TAU);ctx.arc(u.x+u.r*.3,u.y-u.r*.2,3,0,TAU);ctx.fill();
    if(u.hp<u.maxhp)bar(ctx,u.x-24,u.y-u.r-14,48,6,u.hp/u.maxhp,'#d9a24b');
    if(u.kind!=='golem'){
      ctx.fillStyle='rgba(233,226,207,.75)';
      ctx.font='11px sans-serif';ctx.textAlign='center';
      ctx.fillText(d.nm,u.x,u.y-u.r-20);
    }
  }
  /* 小兵 */
  for(const u of G.units){
    if(u.type!=='minion'||u.dead||!inView(u))continue;
    const tc=u.team===0?'#4a7dc9':'#c94a4a';
    const tt=G.t*8+u.id;
    const bob=u.moving?Math.sin(tt)*1.5:0;
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.beginPath();ctx.ellipse(u.x,u.y+u.r*.55,u.r*.85,u.r*.32,0,0,TAU);ctx.fill();
    ctx.save();
    ctx.translate(u.x,u.y+bob);
    ctx.rotate(u.face+Math.PI/2);
    if(u.kind==='siege'){
      ctx.fillStyle='#5a5348';
      ctx.beginPath();ctx.arc(0,0,u.r,0,TAU);ctx.fill();
      ctx.strokeStyle=tc;ctx.lineWidth=2.5;ctx.stroke();
      ctx.fillStyle='#3c372e';
      ctx.beginPath();ctx.arc(0,u.r*.15,u.r*.5,0,TAU);ctx.fill();
      ctx.save();ctx.shadowColor=tc;ctx.shadowBlur=8;ctx.fillStyle=tc;
      ctx.beginPath();ctx.arc(0,-u.r*.3,u.r*.22,0,TAU);ctx.fill();ctx.restore();
    }else{
      ctx.fillStyle=tc;
      ctx.beginPath();ctx.ellipse(0,0,u.r*.5,u.r*.62,0,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(8,10,16,.5)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#e8d8c0';
      ctx.beginPath();ctx.arc(0,-u.r*.3,u.r*.28,0,TAU);ctx.fill();
      ctx.strokeStyle=u.kind==='ranged'?'#9a7a4a':'#cfd8e4';
      ctx.lineWidth=2;ctx.lineCap='round';
      if(u.kind==='ranged'){ctx.beginPath();ctx.arc(u.r*.45,0,u.r*.6,-1.9,-.9);ctx.stroke();}
      else{ctx.beginPath();ctx.moveTo(u.r*.4,u.r*.3);ctx.lineTo(u.r*.4,-u.r*.75);ctx.stroke();}
    }
    ctx.restore();
    if(u.hp<u.maxhp)bar(ctx,u.x-14,u.y-u.r-9,28,4,u.hp/u.maxhp,u.team===0?'#39d353':'#ff5252');
  }
  /* 弹道 */
  for(const p of G.projs){
    let dx,dy;
    if(p.homing){dx=p.x-(p.trailX||p.x);dy=p.y-(p.trailY||p.y);}
    else{dx=p.dx;dy=p.dy;}
    const dl=Math.hypot(dx,dy),a=dl>.001?Math.atan2(dy,dx):0;
    ctx.save();
    ctx.translate(p.x,p.y);ctx.rotate(a);
    ctx.shadowColor=p.col;ctx.shadowBlur=10;
    const st=p.style;
    if(st==='arrow'){
      ctx.strokeStyle=p.col;ctx.lineWidth=3;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(8,0);ctx.stroke();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(2,-3.5);ctx.lineTo(2,3.5);ctx.closePath();ctx.fill();
    }else if(st==='crystal'){
      ctx.fillStyle='#cfeeff';
      ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(0,-9);ctx.lineTo(-14,0);ctx.lineTo(0,9);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      ctx.strokeStyle='rgba(143,224,255,.5)';ctx.lineWidth=4;
      ctx.beginPath();ctx.moveTo(-34,0);ctx.lineTo(-14,0);ctx.stroke();
    }else if(st==='chain'){
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(0,-8,6,0,TAU);ctx.arc(0,8,6,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(245,230,168,.8)';ctx.lineWidth=3;
      ctx.setLineDash([5,5]);
      ctx.beginPath();ctx.moveTo(-20,-4);ctx.lineTo(20,4);ctx.stroke();
      ctx.setLineDash([]);
    }else if(st==='wand'){
      ctx.rotate(G.t*8);
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(7,0);ctx.lineTo(0,10);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();
    }else if(st==='crescent'){
      ctx.strokeStyle=p.col;ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(-6,0,14,-1.3,1.3);ctx.stroke();
    }else if(st==='tornado'){
      ctx.strokeStyle=p.col;ctx.lineWidth=4;
      for(let i=0;i<3;i++){
        ctx.beginPath();ctx.arc(-i*12,0,12+i*4,G.t*10+i,G.t*10+i+2.4);ctx.stroke();
      }
    }else{
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.arc(0,0,p.homing?6:4.5,0,TAU);ctx.fill();
    }
    ctx.restore();
    if(dl>.1){
      ctx.strokeStyle=p.col;ctx.globalAlpha=.4;ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-dx/dl*30,p.y-dy/dl*30);ctx.stroke();
      ctx.globalAlpha=1;
    }
    p.trailX=p.x;p.trailY=p.y;
  }
  /* 英雄 */
  for(const u of G.units){
    if(u.type!=='champ'||u.dead||!inView(u))continue;
    drawChampBody(ctx,u.x,u.y,u.r,u.cid,u.team,u.face,G.t,u.isPlayer?'#f0d489':null,u);
    /* 禁锢/眩晕标记 */
    if(u.rootT>0||u.stunT>0){
      ctx.strokeStyle=u.stunT>0?'#ffd24a':'#9fd8f0';ctx.lineWidth=2.5;
      for(let i=0;i<3;i++){
        const a=G.t*4+i*TAU/3;
        ctx.beginPath();ctx.arc(u.x,u.y,u.r+11,a,a+.7);ctx.stroke();
      }
    }
    /* 鹰眼侦察标记 */
    if((G.revealUntil||0)>G.t&&u.team===1){
      ctx.strokeStyle='rgba(255,90,90,.6)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(u.x,u.y,u.r+16+Math.sin(G.t*6)*4,0,TAU);ctx.stroke();
    }
    /* 减速标记 */
    if(u.slowT>G.t){
      ctx.strokeStyle='rgba(125,180,255,.7)';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(u.x,u.y,u.r+6,G.t*3,G.t*3+2.2);ctx.stroke();
    }
    if(u.shield>0){
      ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(u.x,u.y,u.r+7,0,TAU);ctx.stroke();
    }
    /* 回城引导 */
    if(u.recallT>=0){
      const p=u.recallT/3.4;
      ctx.strokeStyle='#f0d489';ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(u.x,u.y,u.r+13,-Math.PI/2,-Math.PI/2+p*TAU);ctx.stroke();
    }
    /* 等级徽章 */
    ctx.fillStyle='#101724';ctx.strokeStyle='#c9a24b';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(u.x-u.r-11,u.y+u.r+2,9,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle='#f0d489';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(u.level,u.x-u.r-11,u.y+u.r+3);
    /* 血条 / 蓝条 */
    const bw=54;
    ctx.fillStyle='rgba(8,10,16,.75)';ctx.fillRect(u.x-bw/2-1,u.y-u.r-30,bw+2,14);
    bar(ctx,u.x-bw/2,u.y-u.r-29,bw,5.5,u.hp/u.maxhp,u.team===0?'#39d353':'#ff5252');
    if(u.shield>0)bar(ctx,u.x-bw/2,u.y-u.r-29,bw*Math.min(1,u.shield/u.maxhp),5.5,'rgba(255,255,255,.75)');
    if(u.maxmana>0)bar(ctx,u.x-bw/2,u.y-u.r-22.5,bw,3,u.mana/u.maxmana,'#2f7fd6');
    ctx.font='11px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.fillStyle=u.isPlayer?'#ffe9a8':'rgba(233,226,207,.85)';
    ctx.fillText(u.name,u.x,u.y-u.r-34);
  }
  /* 玩家普攻范围 */
  const pl=G.player;
  if(pl&&pl.alive&&!pl.dead&&input.mag<=.15){
    ctx.strokeStyle='rgba(233,226,207,.08)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(pl.x,pl.y,pl.range+pl.r*.5,0,TAU);ctx.stroke();
  }
  /* 粒子 */
  for(const p of G.parts){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  /* 风之障壁 */
  for(const w of G.walls){
    ctx.save();
    ctx.translate(w.cx,w.cy);ctx.rotate(w.ang);
    ctx.globalAlpha=.8*Math.min(1,w.until-G.t);
    ctx.strokeStyle='#cfe8f0';ctx.lineWidth=6;ctx.lineCap='round';
    for(let i=0;i<4;i++){
      const yy=-95+i*63;
      ctx.beginPath();ctx.moveTo(0,yy);
      ctx.quadraticCurveTo(60,yy-14,120,yy);
      ctx.stroke();
    }
    ctx.globalAlpha=1;ctx.restore();
  }
  /* 技能特效 */
  for(const f of G.fx){
    const k=f.t/f.dur,a=1-k;
    ctx.save();
    switch(f.type){
      case 'slash':
        ctx.translate(f.x,f.y);ctx.rotate(f.ang);
        ctx.strokeStyle=f.col;ctx.lineWidth=5*a+2;ctx.globalAlpha=a;
        ctx.beginPath();ctx.arc(0,0,26+k*20,-1.1,1.1);ctx.stroke();
        break;
      case 'spin':
        ctx.strokeStyle=f.col;ctx.globalAlpha=a*.8;ctx.lineWidth=6;
        ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.6+.4*k),0,TAU);ctx.stroke();
        break;
      case 'empower':
        ctx.strokeStyle=f.col;ctx.globalAlpha=a;ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(f.x,f.y,f.r*(.4+.6*k),0,TAU);ctx.stroke();
        break;
      case 'shield':
        ctx.strokeStyle=f.col;ctx.globalAlpha=a*.9;ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(f.x,f.y,f.r+Math.sin(k*Math.PI)*8,0,TAU);ctx.stroke();
        break;
      case 'powerhit':case 'detonate':
        ctx.strokeStyle=f.col;ctx.globalAlpha=a;ctx.lineWidth=6*a+2;
        ctx.beginPath();ctx.arc(f.x,f.y,f.r*k+8,0,TAU);ctx.stroke();
        break;
      case 'execute':{
        ctx.globalAlpha=a;
        const drop=1-Math.min(1,k*2.5);
        ctx.save();ctx.translate(f.x,f.y-140*drop);ctx.rotate(Math.PI/4);
        ctx.fillStyle='#f0d489';ctx.fillRect(-10,-34,20,68);
        ctx.restore();
        ctx.strokeStyle='rgba(240,212,137,.5)';ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(f.x,f.y,f.r*k,0,TAU);ctx.stroke();
        break;}
      case 'beam':{
        const w2=f.w*(1-k*.4);
        ctx.translate(f.x,f.y);ctx.rotate(f.ang);
        const bg=ctx.createLinearGradient(0,0,f.len,0);
        bg.addColorStop(0,'rgba(255,255,255,.95)');
        bg.addColorStop(.2,f.col);
        bg.addColorStop(1,'rgba(245,230,168,0)');
        ctx.globalAlpha=a;
        ctx.fillStyle=bg;
        ctx.fillRect(0,-w2/2,f.len,w2);
        ctx.fillStyle='rgba(255,255,255,.9)';
        ctx.fillRect(0,-w2/6,f.len,w2/3);
        break;}
      case 'alphaghost':case 'blink':case 'flowbreak':
        ctx.strokeStyle=f.col;ctx.globalAlpha=a*.8;ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1-k*.3),0,TAU);ctx.stroke();
        break;
      case 'medit':
        ctx.strokeStyle=f.col;ctx.globalAlpha=a*.7;ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(f.x,f.y,f.r+k*10,0,TAU);ctx.stroke();
        break;
      case 'lift':
        ctx.strokeStyle=f.col;ctx.globalAlpha=a;ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(f.x,f.y-k*26,f.r,0,TAU);ctx.stroke();
        break;
      case 'frostnova':
        ctx.strokeStyle=f.col;ctx.globalAlpha=a;ctx.lineWidth=5;
        ctx.beginPath();ctx.arc(f.x,f.y,f.r*k+20,0,TAU);ctx.stroke();
        for(let i=0;i<6;i++){
          const an=i/6*TAU;
          ctx.beginPath();
          ctx.moveTo(f.x+Math.cos(an)*14,f.y+Math.sin(an)*14);
          ctx.lineTo(f.x+Math.cos(an)*(f.r*k+34),f.y+Math.sin(an)*(f.r*k+34));
          ctx.stroke();
        }
        break;
      case 'wallfx':case 'block':
        ctx.strokeStyle=f.col;ctx.globalAlpha=a;ctx.lineWidth=4;
        ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1+k),0,TAU);ctx.stroke();
        break;
      case 'hawk':{
        const px=f.x+Math.cos(f.ang)*f.t*520,py=f.y+Math.sin(f.ang)*f.t*520;
        ctx.translate(px,py);ctx.rotate(f.ang);
        ctx.strokeStyle=f.col;ctx.lineWidth=3;
        const fl=Math.sin(f.t*22)*8;
        ctx.beginPath();ctx.moveTo(0,-8);ctx.quadraticCurveTo(-12,-fl,-22,-4);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,-8);ctx.quadraticCurveTo(12,-fl,22,-4);ctx.stroke();
        break;}
      case 'ultslash':
        ctx.translate(f.x,f.y);ctx.rotate(k*2);
        ctx.strokeStyle=f.col;ctx.globalAlpha=a;ctx.lineWidth=7;
        for(let i=0;i<3;i++){
          ctx.beginPath();
          ctx.moveTo(-f.r+i*16,-f.r);
          ctx.lineTo(f.r-i*16,f.r);
          ctx.stroke();
        }
        break;
    }
    ctx.restore();
  }
  /* 飘字 */
  ctx.textAlign='center';
  for(const t of G.texts){
    ctx.globalAlpha=Math.max(0,1-t.t/t.life);
    ctx.font=`bold ${t.size}px "Microsoft YaHei",sans-serif`;
    ctx.strokeStyle='rgba(0,0,0,.7)';ctx.lineWidth=3;
    ctx.strokeText(t.txt,t.x,t.y);
    ctx.fillStyle=t.col;ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;
}

/* ---------- 小地图 ---------- */
function drawMinimap(){
  const S=138,k=S/WORLD;
  mmCtx.setTransform(1,0,0,1,0,0);
  if(mapCv)mmCtx.drawImage(mapCv,0,0,S,S);
  mmCtx.fillStyle='rgba(8,12,18,.45)';mmCtx.fillRect(0,0,S,S);
  mmCtx.strokeStyle='rgba(201,162,75,.25)';mmCtx.lineWidth=1;
  mmCtx.strokeRect(.5,.5,S-1,S-1);
  mmCtx.strokeStyle='rgba(95,208,200,.3)';mmCtx.lineWidth=3;
  mmCtx.beginPath();mmCtx.moveTo(8,8);mmCtx.lineTo(S-8,S-8);mmCtx.stroke();
  mmCtx.strokeStyle='rgba(120,110,70,.5)';mmCtx.lineWidth=4;
  for(const ln of Object.values(LANES)){
    mmCtx.beginPath();mmCtx.moveTo(ln[0].x*k,ln[0].y*k);
    for(let i=1;i<ln.length;i++)mmCtx.lineTo(ln[i].x*k,ln[i].y*k);
    mmCtx.stroke();
  }
  for(const u of G.units){
    const x=u.x*k,y=u.y*k;
    if(u.type==='nexus'){
      mmCtx.fillStyle=u.alive?TEAM_COL[u.team]:'#3a3a3a';
      mmCtx.save();mmCtx.translate(x,y);mmCtx.rotate(Math.PI/4);
      mmCtx.fillRect(-4,-4,8,8);mmCtx.restore();
    }else if(u.type==='turret'&&u.alive){
      mmCtx.fillStyle=TEAM_COL[u.team];
      mmCtx.fillRect(x-2.5,y-2.5,5,5);
    }else if(u.type==='monster'&&!u.dead){
      mmCtx.fillStyle=u.kind==='dragon'?'#5fd0c8':'rgba(201,162,75,.8)';
      mmCtx.beginPath();mmCtx.arc(x,y,u.kind==='dragon'?3.5:2.2,0,TAU);mmCtx.fill();
    }else if(u.type==='champ'&&u.alive){
      mmCtx.fillStyle=TEAM_COL[u.team];
      mmCtx.beginPath();mmCtx.arc(x,y,3.6,0,TAU);mmCtx.fill();
      if(u.isPlayer){
        mmCtx.strokeStyle='#fff';mmCtx.lineWidth=1.6;
        mmCtx.beginPath();mmCtx.arc(x,y,5,0,TAU);mmCtx.stroke();
      }
    }
  }
  /* 视野框 */
  const s=G.cam.scale;
  mmCtx.strokeStyle='rgba(233,226,207,.35)';mmCtx.lineWidth=1;
  mmCtx.strokeRect((G.cam.x-VW/2/s)*k,(G.cam.y-VH/2/s)*k,VW/s*k,VH/s*k);
}

/* ================= PART 6 · 输入 / 商店 / 流程 ================= */
const input={mag:0,joyA:0,aPress:false,pid:null,ox:0,oy:0};
const joyBase=$('joyBase'),joyKnob=$('joyKnob');
const JOY_MAX=34;
function joyStart(x,y){
  input.ox=x;input.oy=y;
  joyBase.style.display='block';
  joyBase.style.left=(x-59)+'px';joyBase.style.top=(y-59)+'px';
  $('joyHint').style.display='none';
  joyMove(x,y);
}
function joyMove(x,y){
  const dx=x-input.ox,dy=y-input.oy,d=Math.hypot(dx,dy);
  if(d>10){input.joyA=Math.atan2(dy,dx);input.mag=Math.min(1,(d-6)/38);}
  else input.mag=0;
  const kd=Math.min(d,JOY_MAX),nx=d?dx/d:0,ny=d?dy/d:0;
  joyKnob.style.left=(33+nx*kd)+'px';
  joyKnob.style.top=(33+ny*kd)+'px';
}
function joyEnd(){
  input.pid=null;input.mag=0;
  joyBase.style.display='none';
  joyKnob.style.left='33px';joyKnob.style.top='33px';
}
cv.addEventListener('pointerdown',e=>{
  if(!G||G.over||input.pid!==null)return;
  input.pid=e.pointerId;joyStart(e.clientX,e.clientY);
});
window.addEventListener('pointermove',e=>{if(e.pointerId===input.pid)joyMove(e.clientX,e.clientY);});
window.addEventListener('pointerup',e=>{if(e.pointerId===input.pid)joyEnd();});
window.addEventListener('pointercancel',e=>{if(e.pointerId===input.pid)joyEnd();});
window.addEventListener('contextmenu',e=>e.preventDefault());

/* 技能按钮 */
const skillEls={Q:$('skQ'),W:$('skW'),E:$('skE'),R:$('skR')};
function pressSkill(k){
  if(!G||G.over)return;
  const p=G.player;
  if(p.dead)return;
  if(k==='A'){input.aPress=true;return;}
  castSkill(p,k);
}
for(const k of['Q','W','E','R']){
  skillEls[k].addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pressSkill(k);});
}
$('skA').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();pressSkill('A');});
$('btnRecall').addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!G||G.over)return;
  const p=G.player;
  if(p.dead||p.recallT>=0)return;
  if(dist(p,FOUNTAIN[0])<300)return;
  p.recallT=0;Snd.recall();
});
$('btnMute').addEventListener('pointerdown',e=>{
  e.preventDefault();
  $('btnMute').textContent=Snd.toggle()?'♪':'∅';
});

/* ---------- 全屏 ---------- */
const FsUi={
  active(){return !!(document.fullscreenElement||document.webkitFullscreenElement);},
  supported(){const e=document.documentElement||{};return !!(e.requestFullscreen||e.webkitRequestFullscreen);},
  enter(){
    const e=document.documentElement;
    try{
      if(e.requestFullscreen){const p=e.requestFullscreen({navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{});}
      else if(e.webkitRequestFullscreen)e.webkitRequestFullscreen();
      /* 全屏后锁定横屏(安卓 Chrome 支持,其余静默忽略) */
      if(typeof screen!=='undefined'&&screen.orientation&&screen.orientation.lock){
        const l=screen.orientation.lock('landscape');if(l&&l.catch)l.catch(()=>{});
      }
    }catch(err){}
  },
  exit(){try{
    if(document.exitFullscreen)document.exitFullscreen();
    else if(document.webkitExitFullscreen)document.webkitExitFullscreen();
  }catch(e){}}
};
let toastTimer=null;
function toast(msg,long){
  const t=$('toast');if(!t)return;
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),long?6500:3200);
}
function toggleFullscreen(){
  Snd.unlock();
  if(!FsUi.supported()){
    toast('此浏览器不支持网页全屏(iPhone Safari 限制)。请用 Safari「分享 → 添加到主屏幕」,之后从主屏幕图标打开,即无浏览器边框',true);
    return;
  }
  FsUi.active()?FsUi.exit():FsUi.enter();
}
$('btnFsSelect').addEventListener('pointerdown',e=>{e.preventDefault();toggleFullscreen();});
$('btnFs').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggleFullscreen();});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>
  document.addEventListener(ev,()=>{if(typeof resize==='function')resize();}));

/* ---------- 商店 ---------- */
let shopOpen=false,invLen=-1;
function toggleShop(force){
  shopOpen=force!==undefined?force:!shopOpen;
  $('shop').classList.toggle('hidden',!shopOpen);
  if(shopOpen)updateShop();
}
$('btnShop').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();Snd.unlock();toggleShop();});
$('shopClose').addEventListener('pointerdown',e=>{e.preventDefault();toggleShop(false);});
function buildShop(){
  const list=$('shopList');list.innerHTML='';
  for(const it of ITEMS){
    const row=document.createElement('div');
    row.className='sitem';row.dataset.id=it.id;
    row.innerHTML=`<div class="ico">${it.ico}</div><div class="info"><div class="nm">${it.nm}</div><div class="st">${it.desc}</div></div><button>购买</button>`;
    row.querySelector('button').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();buyItem(it.id);});
    list.appendChild(row);
  }
}
function buyItem(id){
  const p=G.player,it=ITEMS.find(i=>i.id===id);
  if(!it||p.items.some(x=>x.id===id)||p.gold<it.cost||p.items.length>=6)return;
  p.gold-=it.cost;p.items.push(it);p.refresh();
  Snd.gold();updateInv();updateShop();
  addText(p.x,p.y-46,it.nm,'#f0d489',13);
}
function updateShop(){
  const p=G.player;
  $('shopGold').textContent='金币 '+Math.floor(p.gold);
  for(const row of $('shopList').children){
    const it=ITEMS.find(i=>i.id===row.dataset.id);
    const owned=p.items.some(x=>x.id===it.id);
    row.classList.toggle('owned',owned);
    const btn=row.querySelector('button');
    btn.disabled=owned||p.gold<it.cost||p.items.length>=6;
    btn.textContent=owned?'已购':'购买';
  }
  const n=ITEMS.filter(it=>!p.items.some(x=>x.id===it.id)&&p.gold>=it.cost&&p.items.length<6).length;
  const bd=$('shopBadge');
  bd.style.display=n>0?'flex':'none';bd.textContent=n;
}
function updateInv(){
  const p=G.player;
  if(p.items.length===invLen)return;
  invLen=p.items.length;
  $('invbar').innerHTML=Array.from({length:6},(_,i)=>{
    const it=p.items[i];
    return `<div class="islot" title="${it?it.nm+' · '+it.desc:''}">${it?it.ico:''}</div>`;
  }).join('');
}

/* ---------- 技能图标 ---------- */
function drawSkillIcon(cv,cid,key){
  const g=cv.getContext('2d'),w=cv.width,h=cv.height;
  const d=CHAMPS[cid];
  g.clearRect(0,0,w,h);
  g.save();g.translate(w/2,h/2);
  const c1=d.col,ranged=d.range>200;
  g.strokeStyle=c1;g.fillStyle=c1;g.lineWidth=3;g.lineCap='round';g.lineJoin='round';
  if(key==='Q'){
    if(ranged){
      g.beginPath();g.moveTo(-10,10);g.lineTo(10,-10);g.stroke();
      g.beginPath();g.moveTo(10,-10);g.lineTo(2,-10);g.moveTo(10,-10);g.lineTo(10,-2);g.stroke();
    }else{
      g.beginPath();g.moveTo(-9,11);g.lineTo(9,-9);g.stroke();
      g.beginPath();g.moveTo(-6,-4);g.lineTo(4,6);g.stroke();
    }
  }else if(key==='W'){
    g.beginPath();
    g.moveTo(0,-12);g.lineTo(10,-6);g.lineTo(10,4);g.lineTo(0,12);g.lineTo(-10,4);g.lineTo(-10,-6);
    g.closePath();
    g.globalAlpha=.25;g.fill();g.globalAlpha=1;g.stroke();
  }else if(key==='E'){
    g.beginPath();g.arc(0,0,9,-.6,3.6);g.stroke();
    g.beginPath();g.moveTo(9,-8);g.lineTo(14,-2);g.lineTo(6,-2);g.closePath();g.fill();
  }else if(key==='R'){
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+Math.PI/4;
      g.beginPath();g.moveTo(Math.cos(a)*3,Math.sin(a)*3);g.lineTo(Math.cos(a)*12,Math.sin(a)*12);g.stroke();
    }
    g.beginPath();g.arc(0,0,4,0,TAU);g.fill();
  }else{
    g.beginPath();g.moveTo(-8,-9);g.lineTo(6,8);g.stroke();
    g.beginPath();g.moveTo(8,-9);g.lineTo(-6,8);g.stroke();
  }
  g.restore();
}
function drawSkillIcons(){
  const cid=G.player.cid;
  for(const k of['Q','W','E','R','A']){
    const el=$(k==='A'?'skA':'sk'+k);
    let cv=el.querySelector('canvas.icn');
    if(!cv){cv=document.createElement('canvas');cv.className='icn';cv.width=52;cv.height=52;el.appendChild(cv);}
    drawSkillIcon(cv,cid,k);
  }
}

/* ---------- HUD 刷新 ---------- */
const hudCache={};
function setTxt(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;}}
let shopT=0;
function updateHUD(dt){
  const p=G.player;
  setTxt('scoreB',G.score[0]);setTxt('scoreR',G.score[1]);
  setTxt('clock',fmtT(G.t));
  setTxt('myLv',p.level);
  setTxt('myGold','◆ '+Math.floor(p.gold));
  const kda=`<b>${p.kills}</b>/${p.deaths}/${p.assists}`;
  if(hudCache.kda!==kda){hudCache.kda=kda;$('myKda').innerHTML=kda;}
  for(const key of['Q','W','E','R']){
    const el=skillEls[key],def=p.cdef.skills[key],cd=p.cds[key];
    const mask=el.querySelector('.cdmask'),sec=el.querySelector('.cdsec'),cost=el.querySelector('.cost'),nm=el.querySelector('.nm');
    if(nm.textContent!==def.nm)nm.textContent=def.nm;
    cost.textContent=def.mana>0?def.mana:'';
    if(p.level<def.lv){
      el.classList.add('lockR');el.classList.remove('dim');
      mask.style.display='none';sec.style.display='none';
      sec.textContent='Lv'+def.lv;
      continue;
    }
    el.classList.remove('lockR');
    if(cd>0){
      mask.style.display='block';sec.style.display='block';
      mask.style.background=`conic-gradient(rgba(8,10,16,.82) ${cd/def.cd*360}deg, transparent 0deg)`;
      sec.textContent=cd>=1?Math.ceil(cd):cd.toFixed(1);
    }else{mask.style.display='none';sec.style.display='none';}
    el.classList.toggle('dim',p.mana<def.mana);
  }
  const cn=$('centerNote');
  if(p.dead){
    cn.classList.remove('hidden');
    cn.innerHTML=`<div class="t1">复活中 ${Math.ceil(p.respawnT)} 秒</div><div class="t2">等级 ${p.level} · 稍安勿躁,泉水见</div>`;
  }else if(p.recallT>=0){
    cn.classList.remove('hidden');
    cn.innerHTML=`<div class="t1">回城中 ${(3.4-p.recallT).toFixed(1)} 秒</div><div class="t2">移动或受到伤害会打断回城</div>`;
  }else cn.classList.add('hidden');
  updateInv();
  shopT-=dt||0;
  if(shopOpen&&shopT<=0){shopT=.4;updateShop();}
}

/* ---------- 选人界面 ---------- */
let selCid=null;
const cardList=[];
function initSelect(){
  const wrap=$('cards');
  for(const cid of Object.keys(CHAMPS)){
    const d=CHAMPS[cid];
    const card=document.createElement('div');
    card.className='card';
    const sk=Object.entries(d.skills).map(([k,v])=>`<span class="sk">${k==='R'?'<b class="g">':''}${k} ${v.nm}${k==='R'?'</b>':''}</span>`).join(' · ');
    card.innerHTML=`<canvas width="150" height="142"></canvas>
      <div class="cname">${d.name}</div>
      <div class="crole">${d.title} · ${d.role}</div>
      <div class="ctags">${sk}</div>`;
    card.addEventListener('pointerdown',()=>{
      Snd.unlock();
      selCid=cid;
      for(const c of wrap.children)c.classList.toggle('sel',c===card);
      $('btnStart').classList.add('ready');
      Snd.gold();
    });
    wrap.appendChild(card);
    cardList.push({cv:card.querySelector('canvas'),cid});
  }
  cardLoop(0);
}
function cardLoop(now){
  if($('select').classList.contains('hidden'))return;
  const t=now/1000;
  for(const c of cardList){
    const g=c.cv.getContext('2d'),w=c.cv.width,h=c.cv.height;
    g.clearRect(0,0,w,h);
    const gr=g.createRadialGradient(w/2,h*.5,8,w/2,h*.5,w*.62);
    gr.addColorStop(0,'rgba(63,155,255,.14)');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(0,0,w,h);
    drawChampBody(g,w/2,h*.52,38,c.cid,-1,-.5+Math.sin(t*1.1+c.cid.length)*.4,t);
    g.fillStyle='rgba(233,226,207,.32)';
    g.font='11px "Microsoft YaHei",sans-serif';g.textAlign='center';
    g.fillText(CHAMPS[c.cid].role,w/2,h-8);
  }
  requestAnimationFrame(cardLoop);
}

/* ---------- 开局 / 主循环 / 结算 ---------- */
let running=false,last=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function startGame(){
  Snd.unlock();
  G=newGame(selCid);
  mapCv=buildMap();
  /* 我方:玩家中路 + 随机双队友 */
  const p=new Champion(selCid,0,CHAMPS[selCid].name,true,'mid');
  G.player=p;G.units.push(p);
  const rest=shuffle(['garen','ashe','lux','yi','yasuo'].filter(c=>c!==selCid));
  G.units.push(new Champion(rest[0],0,BOT_NAMES.ally[rest[0]],false,'top'));
  G.units.push(new Champion(rest[1],0,BOT_NAMES.ally[rest[1]],false,'bot'));
  /* 敌方三人各守一线 */
  const foes=shuffle(['garen','ashe','lux','yi','yasuo']);
  ['top','mid','bot'].forEach((ln,i)=>{
    G.units.push(new Champion(foes[i],1,BOT_NAMES.enemy[foes[i]],false,ln));
  });
  /* 建筑 & 野怪 */
  for(const td of TURRET_DEFS)G.units.push(new Turret(td));
  G.units.push(new Nexus(0),new Nexus(1));
  for(const cp of CAMPS)G.units.push(new Monster(cp,0));
  resize();
  G.cam.x=p.x;G.cam.y=p.y;
  buildShop();updateInv();
  $('select').classList.add('hidden');
  $('hud').classList.remove('hidden');
  drawSkillIcons();
  setTimeout(()=>announce('欢迎来到星耀峡谷','gold'),300);
  setTimeout(()=>announce('摧毁敌方水晶即可获胜','blue'),2100);
  running=true;last=performance.now();
  requestAnimationFrame(frame);
}
function frame(now){
  if(!running)return;
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(dt<=0)return;
  dt=Math.min(dt,.05);
  gameStep(dt);
  drawWorld();
  drawMinimap();
  updateHUD(dt);
}
function showEnd(){
  const win=G.winner===0;
  const et=$('endTitle');
  et.textContent=win?'胜 利':'败 北';
  et.className=win?'win':'lose';
  $('endSub').textContent=(win?'蓝方摧毁了敌方水晶':'红方摧毁了蓝方水晶')+' · 对局时长 '+fmtT(G.t);
  const rows=champs().slice().sort((a,b)=>a.team-b.team||(b.kills-a.kills));
  let html='<table><tr><th>英雄</th><th>阵营</th><th>击杀 / 死亡 / 助攻</th><th>补刀</th><th>金币</th><th>输出</th></tr>';
  for(const c of rows){
    html+=`<tr><td class="${c.isPlayer?'me':''}">${c.name}${c.isPlayer?' (你)':''}</td>`
      +`<td class="${c.team===0?'bb':'rr'}">${TEAM_NAME[c.team]}</td>`
      +`<td>${c.kills} / ${c.deaths} / ${c.assists}</td><td>${c.cs}</td>`
      +`<td>${Math.floor(c.gold)}</td><td>${Math.round(c.dmg)}</td></tr>`;
  }
  $('endStats').innerHTML=html+'</table>';
  $('endscr').classList.remove('hidden');
}
$('btnStart').addEventListener('pointerdown',e=>{e.preventDefault();if(selCid)startGame();});
$('btnAgain').addEventListener('pointerdown',e=>{e.preventDefault();location.reload();});

/* ---------- 启动 ---------- */
resize();
initSelect();

</script>
